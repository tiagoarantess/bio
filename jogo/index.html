<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiaguinho em Construção</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700;800;900&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
/* Layout: um console de bolso. Tela do jogo no topo, controles grandes embaixo, cartões de memória por cima. Visual escuro único, da identidade do link na bio. */
:root{
  --bg:#090b18; --panel:#10142a; --fg:#eef1ff; --muted:#9aa3c7; --line:#2a3160;
  --tec:#b8ff38; --fe:#a56cff; --edu:#ff8049; --emp:#31a7ff;
  --t-display:"Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t-quote:"Fraunces", Georgia, "Times New Roman", serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--t-display);margin:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
header .mk{font-weight:800;color:var(--tec);font-size:13px;letter-spacing:.04em;margin:0}
header h1{font-weight:900;font-size:clamp(20px,5vw,30px);margin:0;line-height:1.1;letter-spacing:-.01em}
.screen{position:relative;width:100%;aspect-ratio:4/3;max-height:72vh;background:#000;border:3px solid #000;box-shadow:0 0 0 2px var(--line),6px 6px 0 #000;margin-inline:auto}
canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar p{margin:0;color:var(--muted);font-size:14px;line-height:1.35;flex:1 1 220px;min-width:0}
.bar p b{color:var(--fg)}
.btns{display:flex;gap:8px}
button{font-family:var(--t-display);font-weight:800;font-size:14px;letter-spacing:.02em;cursor:pointer;border:2px solid #000;background:var(--c,var(--tec));color:#0a0c18;padding:11px 16px;box-shadow:4px 4px 0 #000;border-radius:0}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line);box-shadow:none}
.pad{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none;padding-top:4px}
.pad .dir{display:flex;gap:12px}
.pad button{width:76px;height:68px;font-size:22px;touch-action:none;background:var(--panel);color:var(--fg);border-color:var(--line);box-shadow:4px 4px 0 #000}
.pad button.jump{width:128px;font-size:16px;background:var(--c,var(--tec));color:#0a0c18;border-color:#000}
@media (pointer:coarse){.pad{display:flex}.keys{display:none}}
.keys{color:var(--muted);font-size:13px;margin:0}
.full{color:var(--muted);font-size:14px;margin:4px 0 0}
.full a{color:var(--fg);font-weight:700}
/* cartões */
.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(5,7,16,.66)}
@media (max-width:820px){.overlay{position:fixed;padding:14px max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}}
.card{--c:var(--tec);background:var(--panel);border:2px solid var(--c);box-shadow:6px 6px 0 #000,0 0 28px color-mix(in srgb,var(--c) 30%,transparent);width:100%;max-width:520px;max-height:100%;overflow:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.card .tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h2{font-weight:900;font-size:clamp(20px,5vw,26px);line-height:1.12;margin:0;text-wrap:balance}
.card p{margin:0;font-size:16px;line-height:1.5;font-weight:500}
.card blockquote{margin:0;font-family:var(--t-quote);font-size:19px;line-height:1.35;border-left:3px solid var(--c);padding-left:12px}
.card figure{margin:0;display:flex;flex-direction:column;gap:6px}
.card figure img{width:100%;max-height:44vh;object-fit:contain;background:#000;display:block}
.card figcaption{font-size:13px;color:var(--muted);line-height:1.4}
.card figcaption b{color:var(--c)}
.fala{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--c);padding-left:10px}
.fala b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.fala span{font-family:var(--t-quote);font-size:17px;line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stats div{border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column}
.stats b{font-size:24px;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs div{border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px}
.vs div:last-child{border-color:var(--c)}
.vs b{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.vs div:last-child b{color:var(--c)}
.vs span{font-size:15px}
.term{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#000;border:1px solid var(--line);padding:10px 12px;font-size:15px;color:var(--tec)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--c);color:var(--c);font-size:13px;font-weight:700;padding:5px 9px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:2px}
.cta{display:flex;flex-direction:column;gap:10px}
.cta a,.cta span.pend{display:block;text-decoration:none;font-weight:800;font-size:16px;color:#0a0c18;background:var(--k);border:2px solid #000;box-shadow:4px 4px 0 #000;padding:13px 14px}
.cta span.pend{background:transparent;color:var(--muted);border-color:var(--line);box-shadow:none;font-weight:700}
.cta small{display:block;font-weight:600;font-size:12px;opacity:.8}
.big{font-size:44px;font-weight:900;line-height:1;color:var(--c)}
.card video{width:100%;max-height:46vh;background:#000;display:block}
.dica{background:#ffd36b;color:#1a1200;padding:16px 16px 18px;box-shadow:5px 5px 0 #000;display:flex;flex-direction:column;gap:8px;transform:rotate(-.6deg)}
.dica b{font-weight:900;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.dica p{font-family:var(--t-quote);font-size:22px;line-height:1.3;color:#1a1200;font-weight:600}
.portal{text-align:center;align-items:center}
.portal img{width:132px;height:132px;object-fit:cover;object-position:50% 25%;border-radius:50%;border:4px solid var(--bg);box-shadow:0 0 0 4px var(--tec),0 0 0 8px var(--fe),0 0 0 12px var(--edu),0 0 0 16px var(--emp);margin:18px auto 10px}
.portal h2{font-size:clamp(28px,8vw,38px)}
.portal .fone{color:var(--muted);font-size:14px;margin:0}
.portal .row{justify-content:center;flex-direction:column;width:100%}
.portal .row button{width:100%;max-width:300px;align-self:center}
.lista{display:flex;flex-direction:column;gap:8px}
.lista button{display:flex;justify-content:space-between;gap:10px;text-align:left;width:100%;background:var(--panel);color:var(--fg);border:2px solid var(--k);box-shadow:3px 3px 0 #000}
.lista button span:last-child{color:var(--muted);font-weight:700;white-space:nowrap}
.lista button[disabled]{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.lista button.aqui{background:var(--k);color:#0a0c18}
.lista button.aqui span:last-child{color:#0a0c18}
#goBtn[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Tiago em construção</h1>
    <p class="mk">@otiagoarantes</p>
  </header>
  <div class="screen" id="screen">
    <canvas id="game" aria-label="Jogo de plataforma com a história do Tiago"></canvas>
    <div class="overlay" id="ov" hidden></div>
  </div>
  <div class="bar">
    <p id="mission">Carregando…</p>
    <span class="btns"><button id="goBtn" hidden>Continuar</button><button class="ghost" id="somBtn" aria-pressed="false">♪ som</button><button class="ghost" id="mapBtn">Mapa</button></span>
  </div>
  <div class="pad" id="pad">
    <div class="dir">
      <button data-k="left" aria-label="Andar para a esquerda">◀</button>
      <button data-k="right" aria-label="Andar para a direita">▶</button>
    </div>
    <button class="jump" data-k="jump">PULAR</button>
  </div>
  <p class="keys">← → andar · Espaço pular · Shift correr · M mapa</p>
  <p class="full">Prefere ler? <a href="https://tiagoarantess.github.io/bio/" target="_blank" rel="noopener">Ler a história completa</a></p>
</div>

<script>
(() => {
const W = 320, H = 240, T = 16, ROWS = 15, GROUND = 13, QROW = 9;
const C = {tec:'#b8ff38', fe:'#a56cff', edu:'#ff8049', emp:'#31a7ff'};

/* ============ CONTEÚDO: textos exatos do link na bio ============ */
const WORLDS = [
{ nome:'robótica', regiao:0, tag:'Capítulo 01 · origem', titulo:'Tudo começou com a robótica.', cor:C.tec, inimigo:'', cena:'arena', musica:1,
  look:{c:'#2f7a2a', w:'#b8ff38', p:'#2b3350'},
  cards:[
  {foto:'fotos/2018-entrevista-tv-robotica-1.jpg', ano:'2018', leg:`Comecei pivete. Entrevista de quando nossa equipe se destacou`},

  {texto:`E teve feira de ciências também.\nExperiências que me criaram um olhar crítico-científico sobre a vida.`, video:'fotos/feira-projeto-ciencias.mp4', poster:'fotos/feira-projeto-ciencias-capa.jpg'},
  {foto:'fotos/feira-estande-equipe.jpg', leg:``},

  {foto:'fotos/feira-ciencias-2.jpg', ano:'2023', leg:`Foto na saída do auditório da UFMS, com o troféu, porque na hora da premiação ficamos tão sem acreditar que esquecemos de foto.`}
  ]},
{ nome:'a base', regiao:0, tag:'Capítulo 02 · fé', titulo:'A força da construção está na base que ninguém vê', cor:C.fe, inimigo:'imprevisto', cena:'noite', musica:1,
  look:{c:'#2f7a2a', w:'#b8ff38', p:'#2b3350'}, instavel:2, desabei:1, quarto:2,
  cards:[
  {texto:`Meses de preparo. O robô pronto, a expectativa lá no teto e a certeza de que aquele era o nosso ano.\nTínhamos ganhado a etapa anterior, a regional, em primeiro lugar. Estávamos bem!\nMas, na hora H... aconteceram TODOS os tipos de imprevistos.`},
  {texto:`Desabei.\nMe levaram pra casa pós-competição. Naquele dia, por um milagre, todo mundo tava fora de casa. O silêncio era tudo o que eu precisava. Fechei a porta do quarto e orei. Ou melhor, me derramei... Entre lágrimas, soluços e gritos. Comecei a oração com tristeza, dúvidas e questionamentos, e tudo sublimou para fé e gratidão! No ápice, fiz uma das orações mais ousada da minha vida:`},
  {texto:`“Pode me conduzir pelos processos mais difíceis, porque sei que eles produzirão os melhores frutos.”\nEu tinha 12 anos quando falei isso para Deus. Entrei naquele quarto abalado, mas lá comecei a ver se formar uma rocha firme onde poderia apoiar os meus pés.`},
  {texto:`A base é onde apoiamos a nossa segurança, o nosso valor e a nossa identidade.\nAté aquele dia, sem perceber, a minha base estava nos meus resultados: se conquistasse algo, eu estava bem; quando não conseguia, ficava desesperado.`},
  {texto:`Naquele quarto, a minha base se firmou. E agora a forma como eu enxergo a vida deveria ser a partir daquele novo ponto de vista.\nColoquei a minha dependência no amor de um Pai cujo amor não muda por performance.`},
  {texto:`Já percebeu que quando a gente pisa com medo num terreno que não conhece, a gente anda olhando só para os próprios pés, tentando não cair? Mas quando sabemos que o terreno é firme, finalmente conseguimos levantar a cabeça, olhar ao redor e adiante.`},
  {texto:`Talvez, por isso, peguei o celular e mandei mensagem pra um amigo da equipe, que também tinha ficado meio abalado.\nEu só consegui olhar para o meu amigo e me importar com a dor dele porque transbordei o que tinha acabado de receber naquele quarto.\nPela primeira vez, tive coragem de falar da minha fé e esperança para alguém, mesmo que por mensagem, e ele correspondeu bem.`},
  {dica:true, texto:`Na próxima frustração, não pense que veio para te destruir. Talvez ela só esteja cavando o espaço para construir uma fundação.`}
  ],
  fim:{texto:`Minha fé em Jesus faz parte de tudo que estou construindo.\nFé não é uma parte do meu conteúdo.\nÉ a lente através da qual eu enxergo todas as partes.`}},
{ nome:'vivo', regiao:0, tag:'Me sentindo vivo', titulo:'Meu coração começou a ficar aquecido de amor.', cor:C.fe, inimigo:'medo', cena:'escola', musica:1,
  look:{c:'#c9b98f', w:'#2a4b8d', p:'#2b3a55'},
  cards:[
  {texto:`Um amor maior do que robótica, conquistas acadêmicas e qualquer coisa.\nQuando eu li as palavras de Jesus (embora já tivesse ouvido muito pela boca dos outros, agora tinha parado para ler a Bíblia e buscar na fonte!) minha reação era: Uau! QUANTAS PALAVRAS DESSE HOMEM FAZIAM SENTIDO!`},
  {texto:`As palavras de Jesus me confrontavam, e logo consolavam. Na verdade... ele expunha minha ferida, e vinha com o remédio.\n“Oh! Médico dos médicos.”`},
  {texto:`Comecei a falar desse amor com mais ousadia na pandemia, através de reuniões online com os amigos: eu tinha voz na escola!\nIsso talvez porque era destaque de nota e o mais conversador/bagunceiro da turma, então muitos se achegavam pra ouvir.`},
  {texto:`Com o tempo, aqueles que eram meus amigos já não queriam mais ouvir (ou não queria praticar o que ouviam na mesma intensidade que eu), e nos afastamos... até que fiquei sozinho e distante do meu grupo "popular"\nQuando acabou o lockdown do Covid, voltamos pra escola e eu me sentia só, mas estava em paz com a minha decisão. Todos falavam que eu estava super "zen" se comparado ao Tiago de antes.`},
  {texto:`Começou a despertar uma compaixão dentro de mim e eu não pude mais conter!\nTalvez precisassem do que eu tinha:`, titulo:'Dito e feito!', depois:`Comecei a falar com ousadia...não de religião!\nmas de uma pessoa: Jesus. E começou a fazer sentido para alguns.\nOk, nem sempre era com ousadia, na maioria das vezes tremendo as pernas, na verdade.`},
  {texto:`Primeiro, reuniram 3 na minha casa.`, foto:'fotos/2020-amigos.jpg', leg:`Felizes pós lágrimas de oração`},
  {texto:`Começando pela colega de turma:\nEla era da minha sala, a gente era amigo, mas tinha uma disputa: todo trimestre o colégio atualizava um ranking de notas no sistema escolar. Os primeiros colocados entre todas as turmas, ao final do ano, ganhavam medalha pra usar no uniforme pra sempre. Um dia ela me perguntou:`,
   fala:[['Colega de turma',`Tiago, como você parece tão tranquilo e tira notas melhores que eu? E ainda faz robótica, esporte, um monte de coisa...`],['Tiago',`Não sei explicar... eu já fui ansioso por nota como você, mas desde que coloquei Jesus em primeiro na minha vida... tenho estudado até menos, os resultados melhoraram, talvez eu estudava demais e não descansava, e Jesus me ensinou a equilibrar, não sei`]],
   depois:`A partir daí ela quis ir na minha igreja e decidiu colocar Cristo como prioridade. Ela sentiu uma paz inexplicável e anda no amor de Jesus até hoje.\nNesse mesmo ano, no final, empatamos a média de nota nos milésimos, e nós dois ganhamos a mesma medalha no uniforme (coisa que o colégio nunca tinha feito)`},
  {texto:`Ela era MUITO tímida na sala, e aos poucos foi se soltando... Quem diria que ela ia até pregar na igreja!!`, foto:'fotos/amiga-pregando-na-igreja.jpg', leg:`Olha a menina se desenvolvendo na igreja`},
  {foto:'fotos/2020-oracao-na-varanda.jpg', ano:'2020', leg:`Oração na varanda da minha casa, com "a menina que eu disputava nota" e com um amigo autêntico`, depois:`Ele me procurou DO NADA, dizendo que queria ir na minha igreja, e um tempo depois me contou que parecia sempre feliz, sorria na escola, mas em casa a cabeça pesava quando encostava no travesseiro.`},
  {foto:'fotos/pregando-na-praca.jpg', leg:`Pregando com meu amigo numa praça, na transição pós LockDown`}

{ nome:'voluntário', regiao:0, tag:'Voluntário', titulo:'Intervalo com Deus · Legião de Honra', cor:C.fe, inimigo:'má fama', cena:'escola', musica:1, tenente:true,
  look:{c:'#c9b98f', w:'#2a4b8d', p:'#2b3a55'},
  tenenteCard:{titulo:'Intervalo com Deus', texto:`Quando entrei no Colégio Militar no 6º ano, e era serelepe, sempre fugia de um Tenente que me chamava para ir numa reunião na cantina "pra falar de Deus".\nPILANTRA!`},
  cards:[
  {texto:`Quem diria...\nNa volta pós pandemia, já no ensino médio, quando vi esse Tenente, a primeira coisa que perguntei foi:\n“era o sr que fazia as reuniões cristãs na cantina?”\nE daí a conversa fluiu.`},
  {texto:`Começamos os encontros sem nenhum nome.\nUm dia, olhando papéis pra jogar fora em casa, vi um folheto muito antigo... um convite para o "Intervalo com Deus". Fiquei maravilhado, porque provavelmente meu pai pegou e guardou (meu pai trabalhou nesse colégio anos antes).\nEntão descobri que não estava começando algo novo, mas só continuando algo que existia antes.`},
  {texto:`Vi que Deus não só "mexeu os pauzinhos"... ele ajeitou os pauzinhos, riscou o fósforo e acendeu a fogueira ele mesmo.\nPoderia dizer que comecei isso sozinho, mas chega a ser errado...\nEu, sozinho, fugia... lembra?\nMas, com Ele, aprendi a ser ousado. Desenvolvi coragem arriscando, e só assumi riscos por uma paixão ardente.`},
  {texto:`No final, ficou óbvio não estar sozinho. Acontece o quê você vê nas fotos abaixo:`, foto:'fotos/icd-grupo-cresceu.jpg', ano:'2023', leg:`O grupo começou a crescer`},
  {foto:'fotos/icd-cleiton.jpg', ano:'2023', leg:`Cleiton pregando. Sala com todas cadeiras cheias, e pessoas em pé em todo redor`},
  {foto:'fotos/icd-novo-4.jpg', ano:'2023', leg:`Reuníamos não só alunos, mas militares, professores civis, até faxineiras`},
  {tag:'Legião de Honra', texto:`Depois que me converti e melhorei meu comportamento na escola, consegui entrar numa iniciativa que eu queria há muito tempo...\na Legião de Honra, que fazia ações sociais, e só aceitava alunos exemplares, tanto em nota (coisa que eu tinha), quanto em comportamento (coisa que eu não tinha nos primeiros anos do colégio militar).`},
  {tag:'Legião de Honra', texto:`Quase desisti disso...\nMas após pandemia vi aberta a inscrição, "falei: ah, vou tentar ", fiz o discurso de novo (dessa vez com verdade).\nE não esperava entrar, porque é difícil apagar uma má fama diante das pessoas.\nVocê pode ser perdoado por Deus e ainda sofrer as consequências.\nMas... se você ta no time dele, ele vai transformar até o mal em bênção`},
  {tag:'Legião de Honra', texto:`Inclusive, eu estava tão desapegado que não lembrei o dia que sairia o resultado. Na noite que anunciaram na internet, eu estava fazendo uma live falando de Jesus no Instagram. Uma amiga que eu nem falava há muito tempo entrou na live só para dizer "TIAGOOO, VOCÊ ENTROU NA LEGIÃO". Eu tava orando e quando abri os olhos só vi um monte de comentário, e disse algo do tipo "sério? obrigado por avisar." sem muita reação. Só depois fui processar a alegria e agradecer ao Papai. Esse é o significado daquela bolacha azul que você vê no peito do meu uniforme.`},
  {tag:'Legião de Honra', foto:'fotos/2022-orfanato-legiao-de-honra-1.jpg', ano:'2022', leg:``, texto:`Nessa visita a um orfanato que fizemos no Dia das Crianças com a Legião de Honra, uma criança me desenhou.\nTímido, entregou para uma amiga, que me contou e entregou por ele. Claro que fui falar com ele, olha a alegria dele de ter seu desenho reconhecido, e minha alegria de ser desenhado. (A QUE PARECE MAIS ALEGRE É MINHA AMIGA LÁ ATRÁS KKKKKK)`}
  ]},
{ nome:'diferente', regiao:0, tag:'Diferente', titulo:'Neurodivergente: é isso que me faz um pouco diferente.', cor:C.edu, inimigo:'saturado', cena:'escola', musica:1,

  {texto:`Sou jovem e quero usar minha energia para construir algo de valor para a sociedade.\nQuero que muitos vivam a robótica e sejam transformados por meio dela como eu fui. Quero expandir isso com um método escalável.`, titulo:'Chegou a hora de abrir a minha StartUp!', depois:`Mas pra isso eu vi que precisava de tempo e dinheiro`},

  {texto:`Tivemos férias final do ano, pensei bastante, e no primeiro dia do retorno anunciei minha saída.`, data:true, depois:`No dia 6 de janeiro (meu aniversário inclusive), foi meu último dia, algo simbólico pra mim. Decidi: a partir de hoje iria trabalhar pra mim, assumiria as rédeas da minha vida.`, foto:'fotos/despedida-do-laboratorio.jpg', leg:`Despedida do laboratório e comemoração do aniversário`},
  {texto:`Troquei o ar-condicionado do laboratório secreto pelo sol na cabeça e areia no pé.\nOuvi dezenas de "nãos" até pegar o jeito.\nComecei a vender 4 horas por dia, dia sim dia não, na praia de Fortaleza. Mas eu contava o deslocamento dentro das 4h, e no trabalho, se contasse deslocamento dava 6h.`},
  {vs:[['LABORATÓRIO','tempo 6h, todo dia','dinheiro 3 mil, por mês'],['PRAIA','tempo 4h, dia sim, dia não','dinheiro 4 mil, por mês']], titulo:'Ganhei tempo, dinheiro, tudo que eu precisava.', foto:'fotos/primeira-vez-vendendo-na-praia.jpg', leg:`Primeira vez vendendo na praia os meus próprios produtos.`},
  {tag:'Um dia, numa praça de alimentação em Fortaleza', texto:`Estava vendendo doces. Meus pais não apoiavam. Achavam perigoso. Já tinham me ligado pra falar disso.\nNesse dia vendi para uma mãe que, me parou, perguntou quantos anos eu tinha, olhou nos meus olhos e disse:`, depois:`“Olha, eu tenho um filho de um ano. Se o meu filho tiver a sua idade fazendo exatamente o que você está fazendo, eu vou ser a mãe mais orgulhosa do mundo.”`},
  {texto:`Naquele dia, quando cheguei em casa, eu chorei muito. Em casa não, lembro que foi na lavanderia(vida de solteiro ne). Não sei se chorei de tristeza ou de alegria.\nEu queria que os meus pais vissem dessa forma.\nMas... mesmo que eles não vissem. Mesmo que eles não entendessem.\nAquilo me trouxe muito mais convicção do que eu tô fazendo, do porquê eu tô fazendo, e deu ânimo pra continuar.`},
  {titulo:'Em fevereiro, tranquei a faculdade.', texto:`Tranquei a faculdade e decidi viajar vendendo.\nFiz um rolê pelo Nordeste: Olinda, Recife, Natal.\nDepois fui para São Paulo, e voltei para a minha cidade natal para ver os meus pais.`},
  {texto:`Um dia estava no posto de gasolina, à noite, frio, mas as vendas estavam saindo aos poucos, e decidi continuar. Depois de muitos "nãos" seguidos... (parece que as bênçãos sempre vêm assim, né?)\nEncontrei um japonês. Vendi pra ele.\nQuando falei que estava levantando recurso pra abrir a minha empresa de robótica. Ele já meteu um "AH, ENTÃO VOCÊ TRABALHA NA MESMA ÁREA QUE EU? Conhece o laboratório do Sebrae?"\nEle me falou do Sebrae numa noite. No dia seguinte eu já estava lá, falando com os consultores.`},
  {texto:`Eles me deram uma mentoria sobre o meu modelo de negócio: a ideia de criar uma escola de robótica online era válida, mas levaria tempo.\nEnquanto isso, eu poderia continuar vendendo os doces e criar um robô para vender junto comigo: aumentar a conexão com o cliente e o número de conversões de vendas, pra investir na estruturação da escola.`, foto:'fotos/sebrae-modelagem-3d.jpg', leg:`No Sebrae, modelando o robô em 3D`},

/* ============ ESTADO ============ */

  scale = cv.width / W;
}

/* ============ FASE ============ */
function build(i){
  const w = WORLDS[i], n = w.cards.length, SEG = 11, start = 7, cols = start + n * SEG + 16;

  for (let x = 0; x < cols; x++){ map[GROUND][x] = 1; map[GROUND+1][x] = 1; }
  const q = {}, enemies = [], coins = [], rnd = rng(71 + i * 29);

    if (k === w.quarto) continue; // essa memória aparece no quarto, depois da queda

    if (k === w.desabei) desX = x0 + 3;
    if (k % 2 === 1 && k !== w.desabei){
      const s = w.inimigo === 'não' ? 13 : 14;
      enemies.push({x:(x0+7)*T, y:GROUND*T - s, w:s, h:s, vx:-0.45 - (i > 5 ? 0.15 : 0), vy:0, alive:true, active:false, squash:0, label:w.inimigo, ground:false});
    }

    if (w.instavel && k < w.instavel){
      for (let x = x0+8; x <= x0+10; x++){ map[GROUND][x] = 8; map[GROUND+1][x] = 0; }

    }
    const type = (k + i) % 4;

      for (let x = x0+8; x < x0+10; x++){ map[GROUND][x] = 0; map[GROUND+1][x] = 0; }
    } else if (type === 1){

    } else if (type === 2){

  if (o.vx > 0){ const tx = Math.floor((o.x + o.w) / T); for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)){ o.x = tx*T - o.w - 0.01; o.vx = 0; break; } }
  else if (o.vx < 0){ const tx = Math.floor(o.x / T); for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)){ o.x = (tx+1)*T; o.vx = 0; break; } }
}
function moveY(o){
  o.y += o.vy; o.ground = false; let bump = null;
  const l = Math.floor(o.x / T), r = Math.floor((o.x + o.w - 0.01) / T);
  if (o.vy > 0){ const ty = Math.floor((o.y + o.h) / T); for (let tx = l; tx <= r; tx++) if (solid(tx, ty)){ o.y = ty*T - o.h; o.vy = 0; o.ground = true; break; } }
  else if (o.vy < 0){ const ty = Math.floor(o.y / T), cx = Math.floor((o.x + o.w/2) / T); for (const tx of [cx, l, r]) if (solid(tx, ty)){ o.y = (ty+1)*T; o.vy = 0; bump = {tx, ty}; break; } }
  return bump;
}
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function paras(t){
  return String(t || '').split('\n').map(x => x.trim()).filter(Boolean).map(x =>
    /^[“"].*[”"]$/.test(x) && x.length > 24 ? `<blockquote>${esc(x)}</blockquote>` : `<p>${esc(x)}</p>`).join('');
}
function cardBody(c){
  let h = '';

  if (c.dica) h += `<div class="dica"><b>Dica:</b>${paras(c.texto)}</div>`;
  else if (c.texto) h += paras(c.texto);
  if (c.term) h += `<div class="term">${esc(c.term)}</div>`;
  if (c.titulo && (c.texto || c.foto)) h += `<h2>${esc(c.titulo)}</h2>`;
  if (c.data) h += `<div><span class="big">6</span> <b style="font-size:13px;letter-spacing:.14em;text-transform:uppercase">janeiro</b></div>`;
  if (c.fala) h += c.fala.map(f => `<div class="fala"><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join('');
  if (c.chips) h += `<div class="chips">${c.chips.map(x => `<span>${esc(x)}</span>`).join('')}</div>`;
  if (c.stats) h += `<div class="stats">${c.stats.map(s => `<div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('')}</div>`;
  if (c.vs) h += `<div class="vs">${c.vs.map(v => `<div><b>${esc(v[0])}</b><span>${esc(v[1])}</span><span>${esc(v[2])}</span></div>`).join('')}</div>`;
  if (c.depois) h += paras(c.depois);
  if (c.video) h += `<figure><video src="${esc(c.video)}" poster="${esc(c.poster || '')}" autoplay muted loop playsinline controls></video></figure>`;
  if (c.foto) h += `<figure><img src="${esc(c.foto)}" alt="${esc(c.leg || c.titulo || 'foto do Tiago')}" loading="lazy">${(c.ano || c.leg) ? `<figcaption>${c.ano ? `<b>${esc(c.ano)}</b> ` : ''}${esc(c.leg || '')}</figcaption>` : ''}</figure>`;
  return h;
}
function cardHTML(w, c, extra){
  return `<div class="card" role="dialog" aria-modal="true" style="--c:${w.cor}">
    <span class="tag"><span>${esc(c.tag || w.tag)}</span>${extra || ''}</span>
    ${cardBody(c)}
    <div class="row"><button data-act="ok" style="--c:${w.cor}">Continuar</button></div></div>`;
}
function queueCard(html, actions){ queue.push({html, actions:actions || {}}); if (ov.hidden) nextCard(); }
function nextCard(){
  const c = queue.shift();
  if (!c){ ov.hidden = true; paused = mode !== 'play'; return; }
  paused = true; for (const k in keys) keys[k] = false;
  ov.innerHTML = c.html; ov.hidden = false; ov.scrollTop = 0;
  const card = ov.querySelector('.card'); if (card) card.scrollTop = 0;
  ov.querySelectorAll('button[data-act]').forEach(b => {
    b.onclick = () => { const fn = c.actions[b.dataset.act]; if (fn){ queue.length = 0; ov.hidden = true; fn(); } else nextCard(); };
  });
  const first = ov.querySelector('button'); if (first) first.focus({preventScroll:true});
}

const FLY_LEN = 780;
function startFlight(key, to){
  mode = 'flight'; paused = false;
  fly = {t:0, v:VOOS[key], to, y:110, vy:0, obs:[], got:0, hit:0}; goBtn.hidden = true;
  missionEl.innerHTML = `<b>${esc(fly.v.de)} ✈ ${esc(fly.v.para)}</b> · segure PULAR pra subir, solte pra descer`;
  playMusic();
}
function updateFlight(){
  frame++; fly.t++;
  if (fly.t < FLY_LEN){
    fly.vy += (keys.jump || keys.up) ? -0.32 : 0.2; fly.vy = clamp(fly.vy, -3, 3); fly.y += fly.vy;
    if (fly.y < 26){ fly.y = 26; fly.vy = 0; } if (fly.y > 200){ fly.y = 200; fly.vy = 0; }
    if (fly.hit > 0) fly.hit--;
    if (fly.t % 46 === 0 && fly.t < FLY_LEN - 120){
      const r = Math.sin(fly.t * 12.9898) * 43758.5453, rr = r - Math.floor(r);
      fly.obs.push({x:W + 20, y:30 + rr * 160, kind: (fly.t / 46) % 3 === 1 ? 'nuvem' : 'gear', on:true});
      if ((fly.t / 46) % 2 === 0) fly.obs.push({x:W + 60, y:30 + ((rr * 7) % 1) * 160, kind:'gear', on:true});
    }
    for (const o of fly.obs){
      o.x -= o.kind === 'nuvem' ? 2.6 : 2.2;
      if (!o.on) continue;
      const px = 70, py = fly.y;
      if (o.kind === 'gear' && Math.abs(o.x - px) < 14 && Math.abs(o.y - py) < 14){ o.on = false; gears++; fly.got++; }
      if (o.kind === 'nuvem' && fly.hit === 0 && Math.abs(o.x - px) < 26 && Math.abs(o.y - py) < 16){ fly.hit = 60; gears = Math.max(0, gears - 2); }
    }
    fly.obs = fly.obs.filter(o => o.x > -40);
    return;
  }
  if (fly.t === FLY_LEN){
    paused = true;
    queueCard(`<div class="card" role="dialog" aria-modal="true" style="--c:${fly.v.cor}">
      <span class="tag"><span>${esc(fly.v.de)} → ${esc(fly.v.para)}</span></span><h2>${esc(fly.v.texto)}</h2>
      <div class="row"><button data-act="go" style="--c:${fly.v.cor}">Pousar</button></div></div>`, {go: () => startWorld(fly.to)});
  }
}

// mapa do Brasil em lon/lat, projetado na tela
const proj = (lon, lat) => [Math.round(78 + (lon + 74) / 39.2 * 212), Math.round(22 + (5.3 - lat) / 39 * 212)];
const BRASIL = [[-60,5.2],[-56.5,1.9],[-51.6,4.2],[-50,1.8],[-48.5,-1.2],[-44.3,-2.5],[-41.8,-2.9],[-38.5,-3.7],[-35.2,-5.5],[-34.9,-8],[-35.7,-9.7],[-37,-11],[-38.5,-13],[-39,-17.5],[-40.3,-20.3],[-42,-22.9],[-43.2,-22.9],[-45.4,-23.8],[-48,-25.4],[-48.5,-27.6],[-49.5,-29],[-51,-31],[-52.5,-33.7],[-53.5,-32.5],[-55.5,-30.9],[-57.6,-30.2],[-56,-28.2],[-54.6,-25.6],[-55,-23.9],[-57.9,-22.1],[-58.2,-19.9],[-57.7,-17.7],[-60.2,-16.3],[-60,-13.5],[-65.3,-11],[-69.5,-11],[-73.9,-7.3],[-70,-4.3],[-69.9,-1.1],[-69.4,1],[-67,2],[-64,4],[-60,5.2]].map(p => proj(p[0], p[1]));
const CITIES = [
  {nome:'Campo Grande', ll:[-54.6,-20.4], caps:[0,1,2,3,4], lado:'esq'},
  {nome:'Brasília', ll:[-47.9,-15.8], caps:[5], lado:'esq'},
  {nome:'Fortaleza', ll:[-38.5,-3.7], caps:[6,7], lado:'esq'},
  {nome:'na estrada', ll:[-46.6,-23.5], caps:[8], lado:'dir'},
  {nome:'Florianópolis', ll:[-48.5,-27.6], caps:[9,10], lado:'esq'}
].map(c => Object.assign(c, {p:proj(c.ll[0], c.ll[1])}));
const ESTRADA = [[-38.5,-3.7],[-35.2,-5.8],[-34.9,-8.05],[-46.6,-23.5]].map(p => proj(p[0], p[1]));
const cityOf = i => CITIES.findIndex(c => c.caps.includes(i));
const goBtn = document.getElementById('goBtn');
function goMap(at){
  mode = 'map'; queue.length = 0; ov.hidden = true; paused = true;
  sel = cityOf(clamp(typeof at === 'number' ? at : unlocked, 0, WORLDS.length - 1));
  for (const k in keys) keys[k] = false; prevK = {};
  const w = WORLDS[unlocked];
  document.documentElement.style.setProperty('--c', w.cor);
  const algum = seenAll.some(s => s.length) || unlocked > 0;
  missionEl.innerHTML = algum ? `<b>Você parou em:</b> ${esc(w.tag)}` : `<b>Toque numa cidade</b> ou comece do começo`;
  goBtn.textContent = algum ? `Continuar: capítulo ${unlocked + 1}` : 'Começar';
  goBtn.hidden = false; playMusic();
}
function openCity(ci){
  const c = CITIES[ci];
  const items = c.caps.map(i => {
    const w = WORLDS[i], open = i <= unlocked, n = (seenAll[i] || []).length;
    return `<button data-act="c${i}" style="--k:${w.cor}" class="${i === unlocked ? 'aqui' : ''}" ${open ? '' : 'disabled'}><span>${i + 1} · ${esc(w.tag)}</span><span>${open ? (i === unlocked && !n ? 'você está aqui' : `${n}/${w.cards.length}`) : 'fechado'}</span></button>`;
  }).join('');
  const actions = {map: () => goMap(c.caps[0])};
  c.caps.forEach(i => actions['c' + i] = () => startWorld(i));
  queueCard(`<div class="card" role="dialog" aria-modal="true" style="--c:${WORLDS[c.caps[0]].cor}">

    <div class="lista">${items}</div>
    <div class="row"><button class="ghost" data-act="map">Voltar ao mapa</button></div></div>`, actions);
}
function updateMap(){
  frame++;
  const pressed = k => keys[k] && !prevK[k];
  const maxCity = cityOf(unlocked);
  if (pressed('right') && sel < maxCity) sel++;
  else if (pressed('left') && sel > 0) sel--;
  else if (jumpBuf > 0) openCity(sel);
  jumpBuf = 0; prevK = Object.assign({}, keys);
}
cv.addEventListener('pointerdown', e => {
  if (!ov.hidden) return;
  if (mode === 'flight'){ keys.jump = true; return; }
  if (mode !== 'map') return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  let best = -1, bd = 26;
  CITIES.forEach((c, i) => { const d = Math.hypot(c.p[0] - x, c.p[1] - y); if (d < bd && i <= cityOf(unlocked)){ bd = d; best = i; } });
  if (best >= 0){ sel = best; openCity(best); }
});
const soltar = () => { if (mode === 'flight') keys.jump = false; };
cv.addEventListener('pointerup', soltar); cv.addEventListener('pointercancel', soltar); cv.addEventListener('pointerleave', soltar);
goBtn.onclick = () => startWorld(unlocked);

/* ============ JOGO ============ */
function hurt(from){
  if (P.inv > 0) return;
  P.inv = 80; P.vx = P.x < from.x ? -2.6 : 2.6; P.vy = -4;
  const lose = Math.min(gears, 3); gears -= lose;
  for (let k = 0; k < lose; k++) parts.push({x:P.x + 5, y:P.y, vx:(Math.random() - .5) * 3, vy:-2 - Math.random() * 2, t:40});
}
function update(){
  frame++;
  if (L.desabei === 'pending'){
    // "Desabei.": o chão some embaixo dos pés
    const c = Math.floor((P.x + P.w/2) / T);
    L.hole = [c - 2, c + 2];
    for (let tx = c - 2; tx <= c + 2; tx++){ if (tile(tx, GROUND)) falling.push({x:tx*T, y:GROUND*T, vy:-1 - Math.random()}); L.map[GROUND][tx] = 0; L.map[GROUND+1][tx] = 0; }
    P.vx = 0; L.desabei = 'falling';
  }
  if (L.desabei === 'falling'){
    P.vx *= 0.8; P.vy = Math.min(P.vy + 0.5, 7); P.y += P.vy;
    for (const f of falling){ f.vy = Math.min(f.vy + 0.4, 8); f.y += f.vy; }
    if (P.y > H + 30) startQuarto();
    return;
  }
  const ax = P.ground ? 0.3 : 0.18, max = keys.run ? 3.4 : 2.4;
  if (keys.left){ P.vx -= ax; P.face = -1; }
  else if (keys.right){ P.vx += ax; P.face = 1; }
  else { P.vx *= P.ground ? 0.75 : 0.95; if (Math.abs(P.vx) < 0.05) P.vx = 0; }
  P.vx = clamp(P.vx, -max, max);
  P.coyote = P.ground ? 6 : P.coyote - 1;
  if (jumpBuf > 0){ jumpBuf--; if (P.coyote > 0){ P.vy = keys.run ? -8 : -7.6; P.coyote = 0; jumpBuf = 0; } }
  P.vy = Math.min(P.vy + ((keys.jump && P.vy < 0) ? 0.36 : 0.75), 9);
  moveX(P);
  let b = moveY(P);
  // se a pessoa passar direto pelo bloco do "Desabei.", ele abre sozinho
  if (!b && L.desX >= 0 && !L.desabei && P.x > (L.desX + 1) * T && L.map[QROW][L.desX] === 3) b = {tx:L.desX, ty:QROW};
  if (b){
    const v = L.map[b.ty][b.tx];
    if (v === 2 || v === 3) bumps.push({tx:b.tx, ty:b.ty, t:10});
    if (v === 3){
      L.map[b.ty][b.tx] = 6;
      const k = L.q[b.tx + ',' + b.ty];
      if (k !== undefined){
        seen.add(k); setMission();
        for (let s = 0; s < 10; s++) parts.push({x:b.tx*T + 8, y:b.ty*T, vx:(Math.random() - .5) * 3, vy:-1.5 - Math.random() * 2.5, t:34, star:true});
        const w = WORLDS[wi];
        if (k === w.desabei) L.desabei = 'pending';
        queueCard(cardHTML(w, w.cards[k], `<span>memória ${seen.size}/${w.cards.length}</span>`));
      }
    }
  }
  // base instável
  if (P.ground){
    const fy = Math.floor((P.y + P.h + 1) / T), l = Math.floor(P.x / T), r = Math.floor((P.x + P.w - 0.01) / T);
    let onCrumble = false;
    for (const tx of [l, r]) if (tile(tx, fy) === 8){
      onCrumble = true; const key = tx + ',' + fy; L.crumbleT[key] = (L.crumbleT[key] || 0) + 1;
      if (L.crumbleT[key] > 26){ L.map[fy][tx] = 0; falling.push({x:tx*T, y:fy*T, vy:0}); }
    }
    if (!onCrumble) lastSafe = {x:P.x, y:P.y};
  }
  if (P.inv > 0) P.inv--;
  if (P.y > H + 20){
    gears = Math.max(0, gears - 2);
    P.x = Math.max(0, lastSafe.x - 10); P.y = lastSafe.y - 4; P.vx = 0; P.vy = 0; P.inv = 60;
  }
  // tenente
  const npc = L.npc;
  if (npc && !npc.met){
    const target = P.x - 26;
    npc.vx = clamp((target - npc.x) * 0.05, -1.4, 1.75);
    npc.vy = Math.min(npc.vy + 0.75, 9); moveX(npc); moveY(npc);
    if (npc.ground && npc.vx > 0.4 && solid(Math.floor((npc.x + npc.w + 2) / T), Math.floor((npc.y + npc.h - 4) / T))) npc.vy = -7;
    if (npc.y > H){ npc.x = P.x - 60; npc.y = GROUND*T - 40; npc.vy = 0; }
    if (hit(P, npc)){
      npc.met = true; P.vx = 2.5; P.vy = -4;
      queueCard(cardHTML(WORLDS[wi], WORLDS[wi].tenenteCard));
    }
  }
  for (const e of L.enemies){
    if (!e.alive){ if (e.squash > 0) e.squash--; continue; }
    if (!e.active){ if (e.x < cam + W + 24) e.active = true; else continue; }
    e.vy = Math.min(e.vy + 0.5, 8);
    const pvx = e.vx; moveX(e); if (e.vx === 0) e.vx = -pvx;
    moveY(e);
    if (e.ground){
      const fx = e.vx < 0 ? e.x - 1 : e.x + e.w + 1;
      const below = tile(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T));
      if (below === 0 || below === 8) e.vx = -e.vx;
    }
    if (e.y > H + 30){ e.alive = false; continue; }
    if (hit(P, e)){

  ctx.fillStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < 70; i++){ const x = 90 + (i * 37) % 200, y = 30 + (i * 53) % 200; ctx.fillRect(x, y, 1, 1); }
  // caminhos: estrada de Campo Grande a Brasília, voo pra Fortaleza, estrada pelo Nordeste até SP, voo pra Floripa
  const reached = ci => ci <= cityOf(unlocked);
  const line = (pts, dashed, on, cor) => { ctx.strokeStyle = on ? cor : 'rgba(154,163,199,.25)'; ctx.lineWidth = 2; ctx.setLineDash(dashed ? [3, 4] : []); ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.setLineDash([]); };
  const arc = (a, b, on, cor, bend) => { ctx.strokeStyle = on ? cor : 'rgba(154,163,199,.25)'; ctx.lineWidth = 2; ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo((a[0] + b[0]) / 2 + bend, (a[1] + b[1]) / 2 - 20, b[0], b[1]); ctx.stroke(); ctx.setLineDash([]); };
  line([CITIES[0].p, CITIES[1].p], false, reached(1), C.edu);
  arc(CITIES[1].p, CITIES[2].p, reached(2), '#ffd36b', -14);
  line(ESTRADA, false, reached(3), C.edu);
  arc(CITIES[3].p, CITIES[4].p, reached(4), '#ffd36b', 30);
  ESTRADA.slice(1, 3).forEach(p => { ctx.fillStyle = reached(3) ? '#eef1ff' : '#3a4580'; ctx.fillRect(p[0] - 1, p[1] - 1, 3, 3); });
  // título e legenda
  ctx.font = '900 9px "Libre Franklin", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eef1ff'; ctx.fillText('MAPA DA', 10, 20); ctx.fillText('CONSTRUÇÃO', 10, 31);
  const total = WORLDS.reduce((s, w) => s + w.cards.length, 0), abertas = seenAll.reduce((s, x) => s + x.length, 0);
  ctx.font = '700 7px "Libre Franklin", sans-serif'; ctx.fillStyle = '#9aa3c7';
  ctx.fillText(`${abertas}/${total} memórias`, 10, 46);
  ctx.fillStyle = C.tec; ctx.fillRect(10, 52, 60, 3); ctx.fillStyle = '#2a3160'; ctx.fillRect(10 + 60 * abertas / total, 52, 60 - 60 * abertas / total, 3);
  ctx.fillStyle = '#ffd36b'; ctx.font = '800 7px "Libre Franklin", sans-serif'; ctx.fillText('VOCÊ PAROU EM', 10, 72);
  ctx.fillStyle = '#eef1ff'; ctx.font = '800 8px "Libre Franklin", sans-serif'; ctx.fillText(CITIES[cityOf(unlocked)].nome, 10, 83);
  ctx.fillStyle = '#9aa3c7'; ctx.font = '700 7px "Libre Franklin", sans-serif'; ctx.fillText(`capítulo ${unlocked + 1}`, 10, 93);
  ctx.fillText('toque numa', 10, 214); ctx.fillText('cidade', 10, 224);
  // cidades
  const here = cityOf(unlocked);
  CITIES.forEach((c, i) => {
    const open = i <= here, [x, y] = c.p, w = WORLDS[c.caps[c.caps.length - 1]];
    const doneAll = c.caps.every(k => (seenAll[k] || []).length >= WORLDS[k].cards.length);
    if (i === here){ const r = 9 + (frame % 60) / 6; ctx.strokeStyle = `rgba(255,255,255,${1 - (frame % 60) / 60})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); }
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x + 1, y + 1, 6, 0, 7); ctx.fill();
    ctx.fillStyle = open ? w.cor : '#3a4580'; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();
    if (doneAll){ ctx.fillStyle = '#0a0c18'; ctx.fillRect(x - 2, y - 1, 4, 2); }
    ctx.font = '800 7px "Libre Franklin", sans-serif'; ctx.textAlign = c.lado === 'esq' ? 'right' : 'left';
    const lx = c.lado === 'esq' ? x - 10 : x + 10;
    ctx.fillStyle = open ? '#eef1ff' : '#5a6290'; ctx.fillText(c.nome, lx, y - 1);
    ctx.font = '700 6px "Libre Franklin", sans-serif'; ctx.fillStyle = open ? '#9aa3c7' : '#3a4580';
    const caps = c.caps.length > 1 ? `cap. ${c.caps[0] + 1} a ${c.caps[c.caps.length - 1] + 1}` : `cap. ${c.caps[0] + 1}`;
    ctx.fillText(caps, lx, y + 7);
    if (i === sel && i !== here){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(x - 9.5, y - 9.5, 19, 19); }
  });
  // Tiaguinho onde a pessoa parou
  const p = CITIES[here].p, bob = Math.round(Math.sin(frame / 14));
  drawSprite(p[0] - 6, p[1] - 26 + bob, 1, false, WORLDS[unlocked].look);
}
function drawFlight(){
  const t = fly.t, v = fly.v;
  sky('#2f8fe0', '#bfe6ff');
  for (let i = 0; i < 14; i++){
    const sp = 0.6 + (i % 3) * 0.5, x = ((i * 97 - t * sp * 2) % (W + 80) + W + 80) % (W + 80) - 40, y = 30 + (i * 53) % 170;
    ctx.fillStyle = `rgba(255,255,255,${0.35 + (i % 3) * 0.12})`;
    ctx.beginPath(); ctx.arc(x, y, 7 + (i % 3) * 2, 0, 7); ctx.arc(x + 12, y - 4, 9 + (i % 3) * 2, 0, 7); ctx.arc(x + 24, y, 7, 0, 7); ctx.fill();
  }
  for (const o of fly.obs){
    if (!o.on) continue;
    if (o.kind === 'gear'){ ctx.save(); ctx.translate(o.x - 4, o.y - 5); drawGear(0, 0, false); ctx.restore(); }
    else {
      ctx.fillStyle = '#5b6480'; ctx.beginPath(); ctx.arc(o.x - 12, o.y, 9, 0, 7); ctx.arc(o.x, o.y - 6, 12, 0, 7); ctx.arc(o.x + 13, o.y, 9, 0, 7); ctx.fill(); ctx.fillRect(o.x - 12, o.y, 25, 9);
      ctx.fillStyle = '#ffd36b'; ctx.fillRect(o.x - 1, o.y + 9, 3, 5); ctx.fillRect(o.x - 3, o.y + 13, 3, 4);
    }
  }
  if (t >= FLY_LEN - 120){ ctx.fillStyle = 'rgba(80,140,70,.9)'; ctx.fillRect(0, 214 + Math.max(0, FLY_LEN - t) / 6, W, 40); }
  const landing = t > FLY_LEN - 60 ? (t - (FLY_LEN - 60)) : 0;
  const px = 70 - 48 + landing * 2, py = Math.round(fly.y - 8);
  if (fly.hit > 0 && frame % 6 < 3) return drawFlightHUD();
  ctx.fillStyle = '#f4f6fb'; ctx.fillRect(px, py, 86, 16); ctx.fillRect(px + 86, py + 3, 8, 10); ctx.fillRect(px + 94, py + 6, 4, 5);
  ctx.fillStyle = v.cor; ctx.fillRect(px, py + 10, 94, 3);
  ctx.fillStyle = '#d0d6e6'; ctx.beginPath(); ctx.moveTo(px + 34, py + 12); ctx.lineTo(px + 54, py + 12); ctx.lineTo(px + 36, py + 34); ctx.lineTo(px + 26, py + 34); ctx.fill();
  ctx.fillStyle = '#f4f6fb'; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 10, py); ctx.lineTo(px - 2, py - 18); ctx.lineTo(px - 10, py - 18); ctx.fill();
  ctx.fillStyle = v.cor; ctx.fillRect(px - 9, py - 18, 7, 4);
  ctx.fillStyle = '#7fb6e6'; for (let i = 0; i < 7; i++) ctx.fillRect(px + 14 + i * 9, py + 3, 5, 5);
  ctx.fillStyle = '#2a1a12'; ctx.fillRect(px + 60, py + 3, 5, 2); ctx.fillStyle = '#d9a37a'; ctx.fillRect(px + 60, py + 5, 5, 3);
  drawFlightHUD();
}
function drawFlightHUD(){
  const v = fly.v;
  ctx.fillStyle = 'rgba(8,10,22,.78)'; ctx.fillRect(0, 0, W, 15);
  ctx.fillStyle = v.cor; ctx.fillRect(0, 15, W * Math.min(1, fly.t / FLY_LEN), 2);
  ctx.font = '800 7.5px "Libre Franklin", sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = v.cor; ctx.fillText(`${v.de.toUpperCase()}  ✈  ${v.para.toUpperCase()}`, 6, 8);
  ctx.textAlign = 'right'; ctx.fillStyle = '#eef1ff'; drawGear(W - 38, 3, false); ctx.fillText(String(gears), W - 6, 8);
}
/* ============ QUARTO: depois do "Desabei." ============ */
function startQuarto(){ mode = 'quarto'; paused = false; quarto = {t:0}; }
let quarto = null;
function updateQuarto(){
  frame++; quarto.t++;
  if (quarto.t === 170){
    paused = true;
    const w = WORLDS[wi], k = w.quarto;
    seen.add(k); setMission();
    queueCard(cardHTML(w, w.cards[k], `<span>memória ${seen.size}/${w.cards.length}</span>`), {ok: endQuarto});
  }
}
function endQuarto(){
  // a base se firma: do buraco pra frente, o chão vira rocha
  const from = L.hole[0];
  for (let tx = from; tx < L.cols; tx++) for (const ty of [GROUND, GROUND+1]){ if (tile(tx, ty) === 1 || tile(tx, ty) === 8) L.map[ty][tx] = 9; }
  for (let tx = L.hole[0]; tx <= L.hole[1]; tx++){ L.map[GROUND][tx] = 9; L.map[GROUND+1][tx] = 9; }
  falling = []; L.desabei = 'ok';
  P.x = (L.hole[1] + 2) * T; P.y = GROUND*T - P.h - 30; P.vx = 0; P.vy = 0; P.inv = 40;
  lastSafe = {x:P.x, y:GROUND*T - P.h};
  mode = 'play'; paused = false;
}
function drawQuarto(){
  const t = quarto.t;
  ctx.fillStyle = '#05040c'; ctx.fillRect(0, 0, W, H);
  if (t < 30){ // ainda caindo
    for (let i = 0; i < 20; i++){ ctx.fillStyle = 'rgba(165,108,255,.25)'; ctx.fillRect((i * 53) % W, ((i * 37) + t * 9) % H, 1, 8); }
    drawSprite(154, Math.round(-20 + t * 6), 1, true);
    return;
  }
  const a = Math.min(1, (t - 30) / 60);
  // quarto: parede, porta fechada, cama
  ctx.fillStyle = `rgba(42,31,74,${a})`; ctx.fillRect(0, 0, W, 196);
  ctx.fillStyle = `rgba(28,20,52,${a})`; ctx.fillRect(0, 196, W, 44);
  ctx.fillStyle = `rgba(20,14,38,${a})`; ctx.fillRect(34, 98, 46, 98); ctx.fillStyle = `rgba(255,211,107,${a * .6})`; ctx.fillRect(72, 148, 3, 3);
  ctx.fillStyle = `rgba(70,55,110,${a})`; ctx.fillRect(226, 164, 74, 32); ctx.fillStyle = `rgba(220,215,240,${a * .8})`; ctx.fillRect(228, 158, 22, 8);
  // luz que desce
  const g = Math.max(0, (t - 70) / 80);
  if (g > 0){
    const r = 30 + g * 110;
    const grd = ctx.createRadialGradient(160, 150, 4, 160, 150, r);
    grd.addColorStop(0, `rgba(255,236,170,${0.55 * Math.min(1, g)})`); grd.addColorStop(1, 'rgba(165,108,255,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255,236,170,${0.25 * Math.min(1, g)})`; ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(170, 0); ctx.lineTo(200, 196); ctx.lineTo(120, 196); ctx.fill();
  }
  // Tiaguinho de joelhos
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, 196); ctx.clip();
  drawSprite(154, 182, 1, false); ctx.restore();
  ctx.fillStyle = WORLDS[wi].look.p; ctx.fillRect(152, 192, 16, 4);
}
function draw(){
  ctx.setTransform(scale, 0, 0, scale, 0, 0); ctx.imageSmoothingEnabled = false;
  if (mode === 'map' || mode === 'title') drawMap();
  else if (mode === 'flight') drawFlight();
  else if (mode === 'quarto') drawQuarto();
  else if (L) drawPlay();
}

/* ============ SOM: trilhas do link na bio ============ */
let somOn = false, audio = null, faixa = 0;
const somBtn = document.getElementById('somBtn');
function playMusic(){
  if (!somOn) return;
  const f = mode === 'map' || mode === 'title' ? WORLDS[unlocked].musica : mode === 'flight' ? WORLDS[fly.to].musica : WORLDS[wi].musica;
  if (audio && faixa === f) { if (audio.paused) audio.play().catch(() => {}); return; }
  if (audio) audio.pause();
  faixa = f; audio = new Audio(`../midia/musica/trilha-${f}.mp3`); audio.loop = true; audio.volume = 0.5;
  audio.play().catch(() => {});
}
somBtn.onclick = () => {
  somOn = !somOn; somBtn.setAttribute('aria-pressed', String(somOn)); somBtn.textContent = somOn ? '♪ som ligado' : '♪ som';
  if (somOn) playMusic(); else if (audio) audio.pause();
};
document.getElementById('mapBtn').onclick = () => goMap(mode === 'play' ? wi : unlocked);

/* ============ ENTRADA ============ */
const KM = {ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyZ:'jump', ShiftLeft:'run', ShiftRight:'run', KeyX:'run'};
addEventListener('keydown', e => {
  if (!ov.hidden){ if (e.code === 'Enter' || e.code === 'Space'){ const b = ov.querySelector('button:focus') || ov.querySelector('button'); if (b && document.activeElement !== b){ e.preventDefault(); b.click(); } } return; }
  if (e.code === 'KeyM'){ goMap(mode === 'play' ? wi : unlocked); return; }
  const k = KM[e.code]; if (!k) return; e.preventDefault();
  if (k === 'jump' && !keys.jump) jumpBuf = 6;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys[k] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); if (k === 'jump' && !keys.jump) jumpBuf = 6; keys[k] = true; b.setPointerCapture?.(e.pointerId); };
  const off = e => { e.preventDefault(); keys[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ============ LAÇO ============ */
let acc = 0, last = performance.now();
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60){
    acc -= 1000 / 60;
    if (ov.hidden){
      if (mode === 'play' && !paused) update();
      else if (mode === 'map') updateMap();
      else if (mode === 'flight') updateFlight();
      else if (mode === 'quarto') updateQuarto();
      else frame++;
    }
  }
  draw(); requestAnimationFrame(loop);
}
resize();
sel = cityOf(unlocked);
missionEl.innerHTML = '<b>11 capítulos</b> · uma história em construção';
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  resize();
  titleScreen();
});
requestAnimationFrame(loop);
})();
</script>
