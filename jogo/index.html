<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiaguinho em Construção</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700;800;900&family=Fraunces:opsz,wght@9..144,600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* Layout: um console de bolso. Tela do jogo no topo, controles grandes embaixo, cartões de memória por cima. Visual escuro único, da identidade do link na bio. */
:root{
  --bg:#090b18; --panel:#10142a; --fg:#eef1ff; --muted:#9aa3c7; --line:#2a3160;
  --tec:#b8ff38; --fe:#a56cff; --edu:#ff8049; --emp:#31a7ff;
  --t-display:"Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t-quote:"Fraunces", Georgia, "Times New Roman", serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--t-display);margin:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
header .mk{font-weight:800;color:var(--tec);font-size:13px;letter-spacing:.04em;margin:0}
header h1{font-weight:900;font-size:clamp(20px,5vw,30px);margin:0;line-height:1.1;letter-spacing:-.01em}
.screen{position:relative;width:100%;aspect-ratio:4/3;max-height:72vh;background:#000;border:3px solid #000;box-shadow:0 0 0 2px var(--line),6px 6px 0 #000;margin-inline:auto}
canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar p{margin:0;color:var(--muted);font-size:14px;line-height:1.35;flex:1 1 220px;min-width:0}
.bar p b{color:var(--fg)}
.btns{display:flex;gap:8px}
button{font-family:var(--t-display);font-weight:800;font-size:14px;letter-spacing:.02em;cursor:pointer;border:2px solid #000;background:var(--c,var(--tec));color:#0a0c18;padding:11px 16px;box-shadow:4px 4px 0 #000;border-radius:0}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line);box-shadow:none}
.pad{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none;padding-top:4px}
.pad .dir{display:flex;gap:12px}
.pad button{width:76px;height:68px;font-size:22px;touch-action:none;background:var(--panel);color:var(--fg);border-color:var(--line);box-shadow:4px 4px 0 #000}
.pad button.jump{width:128px;font-size:16px;background:var(--c,var(--tec));color:#0a0c18;border-color:#000}
@media (pointer:coarse){.pad{display:flex}.keys{display:none}}
.keys{color:var(--muted);font-size:13px;margin:0}
.full{color:var(--muted);font-size:14px;margin:4px 0 0}
.full a{color:var(--fg);font-weight:700}
/* cartões */
.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(5,7,16,.66)}
@media (max-width:820px){.overlay{position:fixed;padding:14px max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}}
.card{--c:var(--tec);background:var(--panel);border:2px solid var(--c);box-shadow:6px 6px 0 #000,0 0 28px color-mix(in srgb,var(--c) 30%,transparent);width:100%;max-width:520px;max-height:100%;overflow:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.card .tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h2{font-weight:900;font-size:clamp(20px,5vw,26px);line-height:1.12;margin:0;text-wrap:balance}
.card p{margin:0;font-size:16px;line-height:1.5;font-weight:500}
.card blockquote{margin:0;font-family:var(--t-quote);font-size:19px;line-height:1.35;border-left:3px solid var(--c);padding-left:12px}
.card figure{margin:0;display:flex;flex-direction:column;gap:6px}
.card figure img{width:100%;max-height:44vh;object-fit:contain;background:#000;display:block}
.card figcaption{font-size:13px;color:var(--muted);line-height:1.4}
.card figcaption b{color:var(--c)}
.fala{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--c);padding-left:10px}
.fala b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.fala span{font-family:var(--t-quote);font-size:17px;line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stats div{border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column}
.stats b{font-size:24px;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs div{border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px}
.vs div:last-child{border-color:var(--c)}
.vs b{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.vs div:last-child b{color:var(--c)}
.vs span{font-size:15px}
.term{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#000;border:1px solid var(--line);padding:10px 12px;font-size:15px;color:var(--tec)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--c);color:var(--c);font-size:13px;font-weight:700;padding:5px 9px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:2px}
.cta{display:flex;flex-direction:column;gap:10px}
.cta a,.cta span.pend{display:block;text-decoration:none;font-weight:800;font-size:16px;color:#0a0c18;background:var(--k);border:2px solid #000;box-shadow:4px 4px 0 #000;padding:13px 14px}
.cta span.pend{background:transparent;color:var(--muted);border-color:var(--line);box-shadow:none;font-weight:700}
.cta small{display:block;font-weight:600;font-size:12px;opacity:.8}
.big{font-size:44px;font-weight:900;line-height:1;color:var(--c)}
.card video{width:100%;max-height:46vh;background:#000;display:block}
.dica{background:#ffd36b;color:#1a1200;padding:16px 16px 18px;box-shadow:5px 5px 0 #000;display:flex;flex-direction:column;gap:8px;transform:rotate(-.6deg)}
.dica b{font-weight:900;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.dica p{font-family:var(--t-quote);font-size:22px;line-height:1.3;color:#1a1200;font-weight:600}
.portal{text-align:center;align-items:center}
.portal img{width:132px;height:132px;object-fit:cover;object-position:50% 25%;border-radius:50%;border:4px solid var(--bg);box-shadow:0 0 0 4px var(--tec),0 0 0 8px var(--fe),0 0 0 12px var(--edu),0 0 0 16px var(--emp);margin:18px auto 10px}
.portal h2{font-size:clamp(28px,8vw,38px)}
.portal .fone{color:var(--muted);font-size:14px;margin:0}
.portal .row{justify-content:center;flex-direction:column;width:100%}
.portal .row button{width:100%;max-width:300px;align-self:center}
.lista{display:flex;flex-direction:column;gap:8px}
.lista button{display:flex;justify-content:space-between;gap:10px;text-align:left;width:100%;background:var(--panel);color:var(--fg);border:2px solid var(--k);box-shadow:3px 3px 0 #000}
.lista button span:last-child{color:var(--muted);font-weight:700;white-space:nowrap}
.lista button[disabled]{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.lista button.aqui{background:var(--k);color:#0a0c18}
.lista button.aqui span:last-child{color:#0a0c18}
#goBtn[hidden]{display:none}
/* páginas e tipos de texto, inspirados no link na bio */
.card{max-height:min(100%,640px)}
.card p{font-weight:400;font-size:16.5px;line-height:1.55;color:#dfe3f7}
.pg{display:flex;flex-direction:column;gap:12px;animation:entra .28s ease-out}
@keyframes entra{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.card h3{font-weight:800;font-size:17px;line-height:1.25;margin:0;color:var(--c)}
.card h2.fecho{color:var(--c)}
.card mark{background:color-mix(in srgb,var(--c) 85%,#fff);color:#0a0c18;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.card strong.red{color:#ff5a5a;font-weight:800}
.card strong.hl{color:var(--c);font-weight:800}
.card em{color:var(--muted)}
.card s{text-decoration-thickness:3px;text-decoration-color:#ff5a5a;opacity:.8}
.card blockquote{font-size:20px;color:#fff}
.icones{font-size:34px;line-height:1;letter-spacing:4px}
.nav{justify-content:space-between}
.nav .dots{display:flex;gap:5px;flex:1;justify-content:center}
.nav .dots i{width:7px;height:7px;background:var(--line);display:block}
.nav .dots i.on{background:var(--c)}
.chat{display:flex;flex-direction:column;gap:8px;background:#0b141a;padding:12px;border:1px solid #1f2c34}
.msg{align-self:flex-start;max-width:86%;background:#202c33;color:#e9edef;padding:7px 10px 8px;border-radius:0 10px 10px 10px;font-size:15.5px;line-height:1.4;font-weight:400}
.msg b{display:block;font-size:12px;font-weight:700;color:#53bdeb;margin-bottom:2px}
.msg.eu{align-self:flex-end;background:#005c4b;border-radius:10px 0 10px 10px}
.msg.eu b{color:#7ee2b8}
.velho{background:#efe3c2;color:#3b2f1e;font-family:"Special Elite","Courier New",monospace;font-size:19px;line-height:1.4;padding:18px 16px;box-shadow:inset 0 0 40px rgba(120,90,40,.45),4px 4px 0 #000;filter:sepia(.3)}
.velho em{color:#7a5a2e;font-style:italic;font-size:22px}
.verbete{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.03)}
.verbete b{font-family:var(--t-quote);font-size:28px;color:var(--c);font-weight:600}
.verbete b::after{content:" · verbo";font-family:var(--t-display);font-size:12px;color:var(--muted);letter-spacing:.08em}
.livro{display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--c);padding:10px 12px;background:rgba(255,255,255,.04)}
.livro span{font-size:13px;color:var(--muted)}
.itens{display:flex;flex-direction:column;gap:8px}
.itens div{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.itens b{font-weight:900;color:var(--c);font-size:15px}
.itens span{font-size:15px;color:#dfe3f7}
.cal{width:110px;border:2px solid #000;box-shadow:4px 4px 0 #000;background:#fff;color:#0a0c18;text-align:center;align-self:flex-start}
.cal span{display:block;background:#ff5a5a;color:#fff;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:4px}
.cal b{display:block;font-size:54px;font-weight:900;line-height:1.1}
.term .cursor{display:inline-block;width:8px;height:15px;background:var(--tec);margin-left:4px;vertical-align:-2px;animation:pisca 1s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}
.final-l{font-weight:900;font-size:clamp(26px,7vw,34px);line-height:1.1;margin:0}
/* celular deitado: o jogo ocupa a tela, controles nas laterais */
.vire{display:none;color:var(--muted);font-size:13px;margin:0}
/* com um cartão aberto, os botões de andar somem pra não ficar na frente do Continuar */
body.carta .pad{visibility:hidden}
/* aviso grande pra deitar o celular, por cima do jogo */
.aviso{display:none;position:absolute;inset:0;z-index:4;background:rgba(5,7,16,.88);color:var(--fg);flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;cursor:pointer}
.aviso .fone-gira{font-size:54px;line-height:1;animation:gira 1.8s ease-in-out infinite}
@keyframes gira{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
.aviso b{font-size:22px;font-weight:900;line-height:1.15}
.aviso span{font-size:13px;color:var(--muted);text-decoration:underline}
.portal .deite{display:none;background:var(--tec);color:#0a0c18;font-weight:800;font-size:15px;padding:10px 12px;margin:2px 0 0;box-shadow:4px 4px 0 #000}
@media (pointer:coarse) and (orientation:portrait){
  .vire{display:block}
  .portal .deite{display:block}
  body.jogando:not(.deitou) .aviso{display:flex}
}
@media (pointer:coarse) and (orientation:landscape){
  body{padding:0;background:#000;overflow:hidden}
  header,.keys,.full,.vire,.bar p{display:none}
  .wrap{max-width:none;gap:0}
  .screen{position:fixed;inset:0;margin:auto;height:100vh;height:100dvh;width:auto;max-height:none;max-width:100vw;aspect-ratio:4/3;border:0;box-shadow:none}
  .bar{position:fixed;top:max(6px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));z-index:4}
  .bar button{padding:7px 10px;font-size:12px;background:rgba(9,11,24,.7)}
  .pad{position:fixed;inset:auto 0 0 0;padding:0 max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:3;pointer-events:none}
  .pad button{pointer-events:auto;opacity:.78}
  .overlay{position:fixed}
  .card{max-height:94dvh}
  body.carta .bar{visibility:hidden}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Tiago em construção</h1>
    <p class="mk">@otiagoarantes</p>
  </header>
  <div class="screen" id="screen">
    <canvas id="game" aria-label="Jogo de plataforma com a história do Tiago"></canvas>
    <div class="overlay" id="ov" hidden></div>
    <div class="aviso" id="aviso" role="button" tabindex="0"><div class="fone-gira" aria-hidden="true">📱</div><b>Deite o celular<br>pra jogar</b><span>ou toque aqui pra jogar em pé</span></div>
  </div>
  <div class="bar">
    <p id="mission">Carregando…</p>
    <span class="btns"><button id="goBtn" hidden>Continuar</button><button class="ghost" id="memBtn" hidden>Memórias</button><button class="ghost" id="somBtn" aria-pressed="false">♪ som</button><button class="ghost" id="mapBtn">Mapa</button></span>
  </div>
  <div class="pad" id="pad">
    <div class="dir">
      <button data-k="left" aria-label="Andar para a esquerda">◀</button>
      <button data-k="right" aria-label="Andar para a direita">▶</button>
    </div>
    <button class="jump" data-k="jump">PULAR</button>
  </div>
  <p class="vire">📱↔ Deite o celular pra jogar em tela cheia</p>
  <p class="keys">← → andar · Espaço pular · Shift correr · M mapa</p>
  <p class="full">Prefere ler? <a href="https://tiagoarantess.github.io/bio/" target="_blank" rel="noopener">Ler a história completa</a></p>
</div>

<script>
(() => {
const W = 320, H = 240, T = 16, ROWS = 15, GROUND = 13, QROW = 9;
const C = {tec:'#b8ff38', fe:'#a56cff', edu:'#ff8049', emp:'#31a7ff'};

/* ============ CONTEÚDO: textos exatos do link na bio ============ */
/* Marcas nos textos (só destaque, as palavras são as do site):
   [[m:...]] marca-texto · [[r:...]] vermelho · [[b:...]] cor do capítulo · [[i:...]] itálico · [[s:...]] riscado */
const WORLDS = [
{ nome:'robótica', tag:'Capítulo 01 · origem', titulo:'Tudo começou com a robótica.', cor:C.tec, cena:'arena', trecho:'origem',
  inimigos:['sensor errado','chassi desalinhado','câmera borrada'],
  look:{c:'#2f7a2a', w:'#b8ff38', p:'#2b3350'},
  cards:[

  {pages:[{foto:'fotos/2018-premiacao-no-palco.jpg', ano:'2018', leg:`Competições, medalhas e anos construindo, programando e competindo.`},{foto:'fotos/2019-equipe-testando-robo.jpg', ano:'2019', leg:``},{foto:'fotos/2019-entrega-de-certificados-2.jpg', ano:'2019', leg:``}]},
  {pages:[{foto:'fotos/2022-competicao-1.jpg', ano:'2022', leg:``},{foto:'fotos/2022-apresentacao-em-auditorio.jpg', ano:'2022', leg:``},{foto:'fotos/equipe-robotica-prototipos.jpg', ano:'2022', leg:`Organizando competição na faculdade em Fortaleza`}]},
  {pages:[{titulo:'Feiras de ciências', texto:`E teve feira de ciências também.\nExperiências que me criaram um [[m:olhar crítico-científico]] sobre a vida.`},{video:'fotos/feira-projeto-ciencias.mp4', poster:'fotos/feira-projeto-ciencias-capa.jpg'},{foto:'fotos/feira-estande-equipe.jpg', leg:``}]},
  {pages:[{foto:'fotos/feira-premio-colegio-militar.jpg', ano:'2022', leg:`Medalha de participação kkk na maior feira do centro-oeste, a FETEC`}]},
  {pages:[{foto:'fotos/feira-ciencias-1.jpg', ano:'2023', leg:`No outro ano, voltamos, e recebemos reconhecimento do Austrian Space Fórum, através do Dr. Groemer. Além de ganhar o 1 lugar da feira`},{foto:'fotos/feira-ciencias-2.jpg', ano:'2023', leg:`Foto na saída do auditório da UFMS, com o troféu, porque na hora da premiação ficamos tão sem acreditar que esquecemos de foto.`}]}

{ nome:'a base', tag:'Capítulo 02 · fé', titulo:'A força da construção está na base que ninguém vê', cor:C.fe, cena:'noite', trecho:'fe',

  look:{c:'#2f7a2a', w:'#b8ff38', p:'#2b3350'}, instavel:2, desabei:1, quarto:2,
  cards:[
  {pages:[{texto:`Meses de preparo. O robô pronto, a expectativa lá no teto e a certeza de que aquele era o nosso ano.\nTínhamos ganhado a etapa anterior, a regional, em primeiro lugar. Estávamos bem!\nMas, na hora H... aconteceram [[r:TODOS os tipos de imprevistos.]]`}]},
  {pages:[{titulo:'Desabei.', texto:`Me levaram pra casa pós-competição. Naquele dia, por um milagre, todo mundo tava fora de casa. O silêncio era tudo o que eu precisava. Fechei a porta do quarto e orei. Ou melhor, me derramei... Entre lágrimas, soluços e gritos. Comecei a oração com tristeza, dúvidas e questionamentos, e tudo sublimou para [[b:fé e gratidão!]] No ápice, fiz uma das orações mais ousada da minha vida:`}]},
  {pages:[{citacao:`“Pode me conduzir pelos processos mais difíceis, porque sei que eles produzirão os melhores frutos.”`, texto:`Eu tinha 12 anos quando falei isso para Deus. Entrei naquele quarto abalado, mas lá comecei a ver se formar uma [[m:rocha firme]] onde poderia apoiar os meus pés.`}]},

  {pages:[{texto:`Naquele quarto, a minha base se firmou. E agora a forma como eu enxergo a vida deveria ser a partir daquele novo ponto de vista.\nColoquei a minha dependência no amor de um Pai cujo amor [[m:não muda por performance.]]`}]},
  {pages:[{texto:`Já percebeu que quando a gente pisa com medo num terreno que não conhece, a gente anda olhando só para os próprios pés, tentando não cair? Mas quando sabemos que o terreno é firme, finalmente conseguimos levantar a cabeça, olhar ao redor e adiante.`}]},

{ nome:'vivo', tag:'Me sentindo vivo', titulo:'Meu coração começou a ficar aquecido de amor.', cor:C.fe, cena:'escola', trecho:'fe',
  inimigos:['aprovação','máscara','festa','solidão'],
  look:{c:'#c9b98f', w:'#2a4b8d', p:'#2b3a55'},
  cards:[
  {pages:[{texto:`Um amor maior do que robótica, conquistas acadêmicas e qualquer coisa.\nQuando eu li as palavras de Jesus (embora já tivesse ouvido muito pela boca dos outros, agora tinha parado para ler a Bíblia e buscar na fonte!) minha reação era: Uau! [[b:QUANTAS PALAVRAS DESSE HOMEM FAZIAM SENTIDO!]]`}]},
  {pages:[{citacao:`As palavras de Jesus me confrontavam, e logo consolavam. Na verdade... ele expunha minha ferida, e vinha com o remédio.\nOh! Médico dos médicos.`}]},
  {pages:[{texto:`Comecei a falar desse amor com mais ousadia na pandemia, através de reuniões online com os amigos: eu tinha voz na escola!\nIsso talvez porque era destaque de nota e o mais conversador/bagunceiro da turma, então muitos se achegavam pra ouvir.`},{texto:`Com o tempo, aqueles que eram meus amigos já não queriam mais ouvir (ou não queria praticar o que ouviam na mesma intensidade que eu), e nos afastamos... até que fiquei sozinho e distante do meu grupo "popular"`},{texto:`Quando acabou o lockdown do Covid, voltamos pra escola e eu me sentia só, mas estava em paz com a minha decisão. Todos falavam que eu estava super "zen" se comparado ao Tiago de antes.`}]},
  {pages:[{texto:`Começou a despertar uma compaixão dentro de mim e eu não pude mais conter!\nTalvez precisassem do que eu tinha:`},{grande:'Dito e feito!', texto:`Comecei a falar com ousadia...não de religião!\nmas de uma pessoa: [[b:Jesus.]] E começou a fazer sentido para alguns.\n[[i:Ok, nem sempre era com ousadia, na maioria das vezes tremendo as pernas, na verdade.]]`}]},
  {pages:[
    {foto:'fotos/2020-amigos.jpg', leg:`Felizes pós lágrimas de oração`, texto:`Primeiro, reuniram 3 na minha casa.`},
    {texto:`Começando pela colega de turma:\nEla era da minha sala, a gente era amigo, mas tinha uma disputa: todo trimestre o colégio atualizava um ranking de notas no sistema escolar. Os primeiros colocados entre todas as turmas, ao final do ano, ganhavam medalha pra usar no uniforme pra sempre. Um dia ela me perguntou:`},
    {chat:[['Colega de turma',`Tiago, como você parece tão tranquilo e tira notas melhores que eu? E ainda faz robótica, esporte, um monte de coisa...`,'esq'],['Tiago',`Não sei explicar... eu já fui ansioso por nota como você, mas desde que coloquei Jesus em primeiro na minha vida... tenho estudado até menos, os resultados melhoraram, talvez eu estudava demais e não descansava, e Jesus me ensinou a equilibrar, não sei`,'dir']], antes:`eu respondi, e lembro que até com certo frio na barriga,`},
    {texto:`A partir daí ela quis ir na minha igreja e decidiu colocar Cristo como prioridade. Ela sentiu uma paz inexplicável e anda no amor de Jesus até hoje.\nNesse mesmo ano, no final, empatamos a média de nota nos milésimos, e nós dois ganhamos a mesma medalha no uniforme (coisa que o colégio nunca tinha feito)`},
    {foto:'fotos/amiga-pregando-na-igreja.jpg', leg:`Olha a menina se desenvolvendo na igreja`, texto:`Ela era MUITO tímida na sala, e aos poucos foi se soltando... Quem diria que ela ia até pregar na igreja!!`},
    {foto:'fotos/2020-oracao-na-varanda.jpg', ano:'2020', leg:`Oração na varanda da minha casa, com "a menina que eu disputava nota" e com um amigo autêntico`, texto:`Ele me procurou DO NADA, dizendo que queria ir na minha igreja, e um tempo depois me contou que parecia sempre feliz, sorria na escola, mas em casa a cabeça pesava quando encostava no travesseiro.`},
    {titulo:'Mas por que autêntico? Ele não usava máscara na escola?', texto:`Por conta dessa confissão. Por isso chamei de autêntico. Parando pra pensar, eu também usei máscara antes, e admitir isso me fez ser autêntico. Ele virou um amigão e mais pra frente liderou comigo um movimento no colégio.`}
  ]},
  {pages:[{foto:'fotos/pregando-na-praca.jpg', leg:`Pregando com meu amigo numa praça, na transição pós LockDown`}]}
  ]},
{ nome:'voluntário', tag:'Voluntário', titulo:'Intervalo com Deus · Legião de Honra', cor:C.fe, cena:'escola', trecho:'intervalo', tenente:true,
  inimigos:['má fama','panelinha','uniforme errado'],
  look:{c:'#c9b98f', w:'#2a4b8d', p:'#2b3a55'},
  tenenteCard:{tag:'Intervalo com Deus', pages:[{texto:`Quem diria...\nNa volta pós pandemia, já no ensino médio, quando vi esse Tenente, a primeira coisa que perguntei foi:`},{chat:[['Tiago',`era o sr que fazia as reuniões cristãs na cantina?`,'dir']], depois:`E daí a conversa fluiu.\nEle fazia no fundamental e eu queria fazer no ensino médio, ele não conseguiu dar tanto apoio.\n[[b:Corri atrás de muita coisa sozinho.]]`}]},
  cards:[
  {tag:'Intervalo com Deus', pages:[{texto:`Quando entrei no Colégio Militar no 6º ano, e era serelepe, sempre fugia de um Tenente que me chamava para ir numa reunião na cantina "pra falar de Deus".`, fecho:'PILANTRA!'}]},
  {tag:'Intervalo com Deus', pages:[{texto:`Mas vou contar apenas uma coisa boba, mas é uma curiosidade que poucos sabem:\nComeçamos os encontros sem nenhum nome.`},{texto:`Um dia, olhando papéis pra jogar fora em casa, vi um folheto muito antigo... um convite para o [[m:"Intervalo com Deus"]]. Fiquei maravilhado, porque provavelmente meu pai pegou e guardou (meu pai trabalhou nesse colégio anos antes).\nEntão descobri que não estava começando algo novo, mas só [[b:continuando algo que existia antes.]]`}]},
  {tag:'Intervalo com Deus', pages:[{citacao:`Vi que Deus não só "mexeu os pauzinhos"... ele ajeitou os pauzinhos, riscou o fósforo e acendeu a fogueira ele mesmo.`, icones:'🔥'},{texto:`Poderia dizer que comecei isso sozinho, mas chega a ser errado...\nEu, sozinho, fugia... lembra?\nMas, com Ele, aprendi a ser ousado. Desenvolvi coragem arriscando, e só assumi riscos por uma [[m:paixão ardente.]]`}]},
  {tag:'Intervalo com Deus', pages:[{foto:'fotos/icd-grupo-cresceu.jpg', ano:'2023', leg:`O grupo começou a crescer`, texto:`No final, ficou óbvio não estar sozinho. Acontece o quê você vê nas fotos abaixo:`},{foto:'fotos/icd-cleiton.jpg', ano:'2023', leg:`Cleiton pregando. Sala com todas cadeiras cheias, e pessoas em pé em todo redor`},{foto:'fotos/icd-novo-4.jpg', ano:'2023', leg:`Reuníamos não só alunos, mas militares, professores civis, até faxineiras`}]},
  {tag:'Legião de Honra', pages:[{texto:`Depois que me converti e melhorei meu comportamento na escola, consegui entrar numa iniciativa que eu queria há muito tempo...\na Legião de Honra, que fazia ações sociais, e só aceitava alunos exemplares, tanto em nota (coisa que eu tinha), quanto em comportamento (coisa que eu não tinha nos primeiros anos do colégio militar).`},{texto:`Quase desisti disso...\nMas após pandemia vi aberta a inscrição, "falei: ah, vou tentar ", fiz o discurso de novo (dessa vez com verdade).\nE não esperava entrar, porque é difícil apagar uma [[r:má fama]] diante das pessoas.`},{citacao:`Você pode ser perdoado por Deus e ainda sofrer as consequências.\nMas... se você ta no time dele, ele vai transformar até o mal em bênção`}]},
  {tag:'Legião de Honra', pages:[{texto:`Inclusive, eu estava tão desapegado que não lembrei o dia que sairia o resultado. Na noite que anunciaram na internet, eu estava fazendo uma live falando de Jesus no Instagram.`},{texto:`Uma amiga que eu nem falava há muito tempo entrou na live só para dizer [[b:"TIAGOOO, VOCÊ ENTROU NA LEGIÃO"]]. Eu tava orando e quando abri os olhos só vi um monte de comentário, e disse algo do tipo "sério? obrigado por avisar." sem muita reação. Só depois fui processar a alegria e agradecer ao Papai. Esse é o significado daquela bolacha azul que você vê no peito do meu uniforme.`}]},
  {tag:'Legião de Honra', pages:[{foto:'fotos/2022-orfanato-legiao-de-honra-1.jpg', ano:'2022', leg:``, texto:`Nessa visita a um orfanato que fizemos no Dia das Crianças com a Legião de Honra, uma criança me desenhou.\nTímido, entregou para uma amiga, que me contou e entregou por ele. Claro que fui falar com ele, olha a alegria dele de ter seu desenho reconhecido, e minha alegria de ser desenhado. [[i:(A QUE PARECE MAIS ALEGRE É MINHA AMIGA LÁ ATRÁS KKKKKK)]]`}]}
  ]},
{ nome:'diferente', tag:'Diferente', titulo:'Neurodivergente: é isso que me faz um pouco diferente.', cor:C.fe, cena:'escola', trecho:'diferente',
  inimigos:['saturado','agenda cheia','tempo escasso'],
  look:{c:'#c9b98f', w:'#2a4b8d', p:'#2b3a55'},
  cards:[
  {pages:[{texto:`Fui diagnosticado com AHSD há mais de uma década. Começou assim:`, fala:[['8 anos · aula de matemática',`Eu terminava as atividades rápido e ficava à toa, conversando. Em vez de brigar comigo, a professora Sônia (obrigado, professora 🙏) chamou a coordenação e pediu uma avaliação no NAAHS, o núcleo de Altas Habilidades do estado. Uma neuropsicóloga confirmou.`]]},{fala:[['no núcleo',`Pouca estrutura. Basicamente me deixavam desenhando e pintando.\nAchei chato. E logo saí.`]]},{fala:[['13 anos · de volta',`Uma amiga do meu grupo de robótica me contou que o núcleo tinha mudado de nome (agora CEAM/AHS) e de lugar. Sem expectativa nenhuma, voltei. Novo teste psicológico: deu de novo. E todos os psicólogos e psiquiatras de lá pra cá só confirmam.`]]}]},
  {pages:[{grande:'Isso não me faz melhor. Só me faz diferente.', texto:`Todo mundo tem [[b:potenciais a serem explorados]] e [[b:dificuldades a serem tratadas.]]`}]},
  {pages:[{texto:`No Centro Estadual de Altas Habilidades, em Mato Grosso do Sul, eu desenvolvia projetos de exatas: robótica, matemática, física e programação. A área em que eu tinha sido diagnosticado.\nAté que, do nada (após a pandemia rs), os meus interesses mudaram.`},{texto:`Eu já estava saturado das aulas de matemática. E meu tempo era escasso:`, chips:['ensino médio','Intervalo com Deus','Legião de Honra','projetos de ciências','robótica','igreja','esportes','agenda cheia'], depois:`Cada atividade do meu dia tinha que fazer sentido pras minhas prioridades. E ali não estava fazendo.`}]},
  {pages:[{texto:`Eu queria explorar a minha fé, as profundezas do que acredito, de onde ela veio e conhecer\nos homens que viveram intensamente por ela:`},{citacao:`"Os quais, pela fé, venceram reinos, praticaram a justiça, alcançaram promessas, fecharam a boca de leões, apagaram a força do fogo, escaparam do fio da espada, da fraqueza tiraram força..."`, depois:`Hebreus 11:33-34`}]},
  {pages:[{texto:`Só que como eu ia explicar isso pra coordenação? Pedir pra sair justo das aulas em que eu tinha mais desenvoltura, pra estudar história da igreja?`, chips:['pernas tremendo','barriga gelada','coração apertado']},{texto:`Mesmo assim, fui e falei:`, fala:[['eu',`Eu quero trocar os meus atendimentos de exatas. Já estou saturado e tenho novos interesses e prioridades nessa fase da minha vida.`],['coordenação',`Claro, Tiago. E quais seriam os seus novos interesses?`],['eu',`Eu quero aprender a história, especificamente história da igreja.`],['coordenação',`Nossa, você vai se identificar então com a professora de história.`]]}]},
  {pages:[{texto:`Foi assim: simples. Na semana seguinte eu já estava lá. E o que eu descobri no primeiro dia?`, fecho:'A professora de história era pastora.'},{texto:`E não daquelas que você encontra em qualquer esquina, com jargão pronto, aleluia glória a Deus. [[m:Amável, sábia, estudiosa.]] Os livros que eu queria ler? Ela já tinha lido. As histórias de avivamento que eu nunca achei ninguém na igreja pra me contar? Ela já tinha estudado.`},{texto:`E ela me questionava fundo:`, fala:[['professora',`O que é avivamento pra você? Define em 3 palavras, sem pensar muito.`],['professora',`O que você acha que precisamos? O que nos falta para um avivamento?`]]}]},
  {pages:[{grande:'Foi a melhor experiência da minha vida.', texto:`E a melhor decisão: ter me posicionado no que eu queria. Pra descobrir que era um desejo que Ele implantou no meu coração, num caminho que Ele já tinha preparado.`}]}
  ]},
{ nome:'IME', tag:'Capítulo 03 · o sonho do vestibular', titulo:'Meu sonho era o IME.', cor:C.edu, cena:'brasilia', trecho:'rainbows', voo:'fortaleza',
  inimigos:['simulado','vestibular'],
  look:{c:'#2f7a2a', w:'#b8ff38', p:'#2b3350'},
  cards:[
  {pages:[{foto:'fotos/palacio-da-alvorada-equipe-do-ime.jpg', leg:`Na foto, Palácio da Alvorada, e nossa equipe campeã de robótica com a equipe de Robótica do IME, em passeio por Brasília`}]},
  {pages:[{texto:`Após uma competição de robótica que ficamos em primeiro lugar em Brasília, os alunos do IME nos disseram que tínhamos um currículo forte o suficiente para pedir uma bolsa no melhor curso preparatório do Brasil, que fica em Fortaleza...`},{texto:`Disseram também que essa era a melhor forma de termos chances para passar na prova deles:`, fecho:'O VESTIBULAR MAIS DIFÍCIL DO BRASIL 💀', depois:`[[i:(é esperado que se faça alguns anos de cursinho)]]`}]},
  {pages:[{grande:'Mais uma vez, dito e feito!', texto:`Mandamos nosso currículo, e ganhamos [[m:bolsa 100%]] no cursinho mais caro do Brasil.`}]}
  ]},
{ nome:'Fortaleza', tag:'Capítulo 04 · mudança de rota', titulo:'Mas Fortaleza me mostrou um mundo de possibilidades que eu ainda não conhecia.', cor:C.tec, cena:'fortaleza', trecho:'professor',
  inimigos:['simulado','sufoco'],
  look:{c:'#f2f4fa', w:'#31a7ff', p:'#33405f'},
  cards:[
  {tag:'Tempo de preparação', pages:[{foto:'fotos/cursinho-farias-brito-ime-ita.jpg', leg:`Eu, e meu amigo da equipe de robótica sentado logo na minha frente, no cursinho em Fortaleza`, texto:`Esse amigo agora está na faculdade mais inovadora da América Latina, a Inteli\nO cara é bom, @paulo_rbto`}]},
  {pages:[{grande:'E sim, abri mão de ir para o [[s:IME]] 💀', texto:`Por quê? Difícil? Também kkk mas eu poderia continuar tentando...`},{texto:`Acontece que: descobri que não era o único lugar possível de continuar desenvolvendo o que gosto.`, fecho:'Na verdade... comecei a enxergar oportunidades maiores no mundo da robótica.'}]},
  {tag:'o que me abriu a visão', pages:[{foto:'fotos/ifce-residencia.jpg', leg:`Residência no laboratório de Sistemas Embarcados do IFCE`, titulo:'Residência no IFCE · Sistemas Embarcados', texto:`Trabalhando no laboratório de Software do Instituto Federal do Ceará, desenvolvendo projetos de embarcados (uma área específica da robótica rsrs) para grandes empresas e startups.`},{itens:[['Conexão com grandes empresas','projetos reais, pessoas-chaves'],['Desenvolvimento de startups','visão de mercado em robótica'],['Direito de errar','do mais jovem (eu rsrs) ao mais velho, todos tratados como estagiários']]},{texto:`Contato com pessoas incríveis, aprendi muita coisa profunda de eletrônica, tive espaço pra aprender e investimento em capacitação constante. E no sentido financeiro também éramos valorizados:`, stats:[['+3 mil','por mês'],['4h','por dia'],['5x2','escala']]},{foto:'fotos/ifce-laboratorio.jpg', leg:``, texto:`Era um [[m:laboratório secreto]], assinei um termo de confidencialidade por 2 anos, então não posso falar muitas coisas.`, icones:'🤫'}]},
  {tag:'Capítulo 05 · professor', pages:[{foto:'fotos/aula-codigokid-1-capa.jpg', leg:``, grande:'Comecei a trabalhar dando aulas.', texto:`Minhas experiências ensinando passaram por escolas de referência como:`, chips:['CódigoKid','Farias Brito','Colégio Militar de Fortaleza','Instituto Federal do Ceará']},{texto:`Mas tudo começou num canto escuro do prédio do cursinho pro IME\nEu deitado num banco. Matando uma aula de inglês (fácil) do cursinho pro IME, enquanto orava e refletia sobre: 1. o quanto eu queria que meus amigos do cursinho conhecessem Jesus (e muitas orações foram respondidas, tá?)\n2. Como eu tava evoluindo pouco nos simulados pro IME.`},{texto:`Com os insights, pensei que eu precisava me dispor a resolver o problema de alguém, e me ofereci para dar aula... [[m:de forma voluntária!]]\nAcredita?\nLogo gostaram do meu trabalho, me contrataram e até ressarciram o tempo como voluntário.\nDepois fui pra outra escola. E outra ganhando mais. E outra ganhando mais.\nMas isso é história pra outra hora.`},{citacao:`O principal aprendizado é: você encontra seu caminho servindo pessoas com as habilidades que tem!`, texto:`E até quando acha que não têm, existe algo em suas mãos para dispor a servir, mesmo que sejam 5 pães e 2 peixinhos(quem leu, entenda). E se não tiver nada em mãos... Tem pelo menos a mão pra pegar uma enxada? kkkkk\nDava aula e estudava. Ensinar enquanto estou aprendendo... te lembra algum instagram por aí 👀?`}]},
  {tag:'Capítulo 06 · faculdade', pages:[{foto:'fotos/faculdade-ads-1.jpg', leg:``, titulo:'Ao mesmo tempo, fazia faculdade de Análise e Desenvolvimento de Sistemas.', texto:`Eu gostava de programação. Sempre fui o programador das minhas equipes de robótica.\nMas com o tempo descobri que essa faculdade focava apenas em sites e aplicativos. Só que o que eu gosto de programar tem corpo:`},{grande:'eu gosto de programar robôs.', chips:['Software','Eletrônica','Máquinas']}]}
  ]},
{ nome:'vendas', tag:'Capítulo 07 · vendas', titulo:'Decidi sair do emprego no Instituto Federal!', cor:C.emp, cena:'praia', trecho:'vendas', doce:true, pessoas:true, cenas:[[0,'praia'],[6,'estrada']],
  look:{c:'#31a7ff', w:'#ffd36b', p:'#d9c79a', bone:'#ff8049'},
  cards:[
  {pages:[{grande:'Decidi sair do emprego no Instituto Federal!', chat:[['Pai','O QUÊ!?','esq'],['Chefe','Por quê?','esq'],['Amigo','Como assim??','esq']]},{texto:`Sim, todos me questionaram, garantindo que estava certo da minha decisão, e saí! Em paz... sem muita satisfação, apenas dizendo que tava certo da nova fase que queria, porque era difícil explicar o que tinha lido:`},{livro:[`“Não trabalhe para ganhar dinheiro, trabalhe para aprender”`,`Aprendi no livro Pai Rico, Pai Pobre`], texto:`Aprenda as habilidades necessárias para fazer o dinheiro trabalhar pra você.`}]},
  {pages:[{texto:`Sou jovem e quero usar minha energia para construir [[m:algo de valor para a sociedade.]]\nQuero que muitos vivam a robótica e sejam transformados por meio dela como eu fui. Quero expandir isso com um método escalável.`, fecho:'Chegou a hora de abrir a minha StartUp!', depois:`Mas pra isso eu vi que precisava de [[b:tempo]] e [[b:dinheiro]]`},{citacao:`"Ah, Tiago, mas tu trabalhava 4h por dia e ganhava mais que metade da população brasileira, vai me dizer que faltava tempo e dinheiro!?"`, fecho:'Sim, exatamente.'},{texto:`O esgotamento mental era grande. Nunca vai entrar na minha cabeça admitir que as pessoas trabalham 8h por dia para ganhar um salário mínimo.\nDinheiro eu gastava tudo para sobreviver. [[r:(Descobri que no Brasil 3 mil é sobrevivência)]]\nPagando meu aluguel, minhas refeições, deslocamentos, tudo da vida de quem mora sozinho...`},{texto:`E tempo... bom, apesar de estar apenas 4h no trabalho, eu fazia faculdade né, e também academia, e também igreja.`, chips:['tempo','dinheiro','energia mental'], depois:`Onde ia arranjar tempo pra pensar no meu negócio próprio?`}]},
  {pages:[{texto:`Tivemos férias final do ano, pensei bastante, e no primeiro dia do retorno anunciei minha saída.`, data:true, depois:`No dia 6 de janeiro (meu aniversário inclusive), foi meu último dia, algo simbólico pra mim. Decidi: a partir de hoje iria trabalhar pra mim, [[m:assumiria as rédeas da minha vida.]]`},{foto:'fotos/despedida-do-laboratorio.jpg', leg:`Despedida do laboratório e comemoração do aniversário`}]},
  {pages:[{icones:'❄️ → ☀️🏖️', grande:'Troquei o ar-condicionado do laboratório secreto pelo sol na cabeça e areia no pé.', texto:`Ouvi dezenas de "nãos" até pegar o jeito.\nComecei a vender 4 horas por dia, dia sim dia não, na praia de Fortaleza. Mas eu contava o deslocamento dentro das 4h, e no trabalho, se contasse deslocamento dava 6h.`},{vs:[['LABORATÓRIO','tempo 6h, todo dia','dinheiro 3 mil, por mês'],['PRAIA','tempo 4h, dia sim, dia não','dinheiro 4 mil, por mês']], fecho:'Ganhei tempo, dinheiro, tudo que eu precisava.'},{foto:'fotos/primeira-vez-vendendo-na-praia.jpg', leg:`Primeira vez vendendo na praia os meus próprios produtos.`, texto:`[[i:Observação: Eu não comecei vendendo na praia, e não vendia meus próprios produtos. Mas a história de como comecei fica para outra hora... Ela é muito engraçada! E foi aí que vi que dava mais certo vender qualquer produto do que vender minha hora.]]`}]},
  {tag:'Um dia, numa praça de alimentação em Fortaleza', pages:[{texto:`Estava vendendo doces. Meus pais não apoiavam. Achavam perigoso. Já tinham me ligado pra falar disso.\nNesse dia vendi para uma mãe que, me parou, perguntou quantos anos eu tinha, olhou nos meus olhos e disse:`},{citacao:`Olha, eu tenho um filho de um ano. Se o meu filho tiver a sua idade fazendo exatamente o que você está fazendo, eu vou ser a mãe mais orgulhosa do mundo.`},{texto:`Era um casal fitness. Compraram de mim só porque gostaram de mim e da minha abordagem e do meu propósito, o produto em si nem fazia tanto sentido pra eles.\nQuando um mendigo chegou pedindo o resto do que tinha sobrado na mesa, eles deram o doce. Deram tudo.\nEu segurei enquanto ela estava ali.\nNa hora que ela foi embora, eu tive que sair.`},{texto:`Naquele dia, quando cheguei em casa, eu chorei muito. Em casa não, lembro que foi na lavanderia(vida de solteiro ne). Não sei se chorei de tristeza ou de alegria.\nNa verdade... eu sabia, era porque outras pessoas entendiam o que eu estava fazendo. E, mais do que isso, admiravam. Eu já tinha recebido vários elogios e palavras de incentivo, mas dessa vez bateu diferente, porque...`},{grande:'Eu queria que os meus pais vissem dessa forma.', texto:`Mas... mesmo que eles não vissem. Mesmo que eles não entendessem.\nAquilo me trouxe muito mais [[m:convicção]] do que eu tô fazendo, do porquê eu tô fazendo, e deu ânimo pra continuar.`}]},
  {pages:[{grande:'Em fevereiro, tranquei a faculdade.', texto:`Ela também me sugava tempo e energia, e não estava me dando o ROI necessário: o retorno sobre o investimento. Eu gastava energia e tempo ali sem ver que aquilo iria, de fato, me ajudar a concretizar o meu sonho.\nAlém do que já falei, que esse curso ensinava mais sobre programar sites e aplicativos. E eu já sabia o que queria: [[b:construir máquinas.]]`},{grande:'Tranquei a faculdade e decidi viajar vendendo.', chips:['Olinda','Recife','Natal','São Paulo','cidade natal'], texto:`Fiz um rolê pelo Nordeste: Olinda, Recife, Natal.\nDepois fui para São Paulo, e voltei para a minha cidade natal para ver os meus pais.\nLá continuei vendendo...\nInclusive, sem ter o apoio do meu pai pra isso (ele achava estranho e perigoso)`}]},
  {pages:[{texto:`Um dia estava no posto de gasolina, à noite, frio, mas as vendas estavam saindo aos poucos, e decidi continuar. Depois de muitos "nãos" seguidos... [[i:(parece que as bênçãos sempre vêm assim, né?)]]\nEncontrei um japonês. Vendi pra ele.\nJaponês você sabe como é:\nInteligentes, práticos, desenrolados.`},{texto:`Quando falei que estava levantando recurso pra abrir a minha empresa de robótica. Ele já meteu um`, chat:[['japonês',`AH, ENTÃO VOCÊ TRABALHA NA MESMA ÁREA QUE EU? Conhece o laboratório do Sebrae?`,'esq']], depois:`Ele me falou do Sebrae numa noite. [[m:No dia seguinte eu já estava lá]], falando com os consultores.`},{foto:'fotos/sebrae-modelagem-3d.jpg', leg:`No Sebrae, modelando o robô em 3D`, texto:`Eles me deram uma mentoria sobre o meu modelo de negócio: a ideia de criar uma escola de robótica online era válida, mas levaria tempo.\nEnquanto isso, eu poderia continuar vendendo os doces e criar um robô para vender junto comigo: aumentar a conexão com o cliente e o número de conversões de vendas, pra investir na estruturação da escola.`},{foto:'fotos/robo-que-vende-comigo.jpg', leg:`Construindo o robô que vende comigo`, grande:'Um robô vendendo comigo, pra pagar a escola que eu quero construir.'}]}
  ]},

  {tag:'Capítulo 10 · empreender', pages:[{livro:[`Mas no livro Originais: Como os Inconformistas Mudam o Mundo (de Adam Grant), ele mostra que a atitude de questionar o status quo e propor novas soluções (o cerne do imprehendere) não pertence apenas a empresários, mas a qualquer pessoa que deseja inovar em sua comunidade, família ou trabalho.`,`Adam Grant · Originais`]},{texto:`Eu quero servir as pessoas usando a habilidade que tenho, principalmente em robótica e educação, e inovar na forma de ensinar robótica.\nJá tive várias ideias e tentei botar elas pra frente. Muitas ideias minhas deram certo como podem ver na minha história, mas... nem todas.`},{grande:'Talvez seja exatamente esse o ponto...', texto:`Por tentar tanto que conquistei um pouco até aqui. Isso só me motiva a continuar manifestando as minhas ideias.\nE, na real, cada fracasso até aqui tem me gerado uma aprendizagem validada diferente, para redesenhar minha rota.`},{livro:[`“Aprendizado validado”`,`É assim que Eric Ries chama, em A Startup Enxuta, o que sobra de informação de um teste que deu errado.`]}]}

/* ============ ESTADO ============ */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const ov = document.getElementById('ov'), missionEl = document.getElementById('mission');
let scale = 1, wi = 0, L = null, P = null, cam = 0, frame = 0, gears = 0, nos = 0, doces = 0;
let mode = 'title', paused = true, jumpBuf = 0, lastSafe = {x:40, y:0}, bumps = [], falling = [], parts = [];
let fly = null, sel = 0, prevK = {};
const keys = {};
const queue = [];
let unlocked = 0, seenAll = WORLDS.map(() => []);
try {
  unlocked = Math.min(WORLDS.length - 1, parseInt(localStorage.getItem('tc-unlocked') || '0', 10) || 0);
  const s = JSON.parse(localStorage.getItem('tc-seen') || 'null');
  if (Array.isArray(s) && s.length === WORLDS.length) seenAll = s;
  gears = parseInt(localStorage.getItem('tc-gears') || '0', 10) || 0;
} catch (e) {}
function save(){ try { localStorage.setItem('tc-unlocked', String(unlocked)); localStorage.setItem('tc-seen', JSON.stringify(seenAll)); localStorage.setItem('tc-gears', String(gears)); } catch (e) {} }
let seen = new Set();

function resize(){
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));
  scale = cv.width / W;
}
addEventListener('resize', resize);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

/* ============ FASE ============ */
function build(i){
  const w = WORLDS[i], n = w.cards.length, SEG = 11, start = 7, cols = start + n * SEG + 16;
  const map = Array.from({length:ROWS}, () => new Array(cols).fill(0));
  for (let x = 0; x < cols; x++){ map[GROUND][x] = 1; map[GROUND+1][x] = 1; }
  const q = {}, enemies = [], coins = [], rnd = rng(71 + i * 29);
  let desX = -1;
  for (let k = 0; k < n; k++){
    const x0 = start + k * SEG;
    if (k === w.quarto) continue; // essa memória aparece no quarto, depois da queda
    map[QROW][x0+2] = 2; map[QROW][x0+3] = 3; map[QROW][x0+4] = 2;
    q[(x0+3) + ',' + QROW] = k;
    if (k === w.desabei || (w.tenente && k === 0)) desX = x0 + 3;
    if (w.pessoas){
      // pessoas na praia e na estrada: cada uma pode dizer "NÃO"
      enemies.push({x:(x0+7)*T, y:GROUND*T - 20, w:10, h:20, vx:-0.35 - rnd() * 0.25, vy:0, alive:true, active:false, squash:0, pessoa:true, nao:0, disse:false, cor:['#ff8049','#a56cff','#2fb37a','#e04f6a','#f4b400'][k % 5], ground:false});
      if (k % 2 === 0) enemies.push({x:(x0+10)*T, y:GROUND*T - 20, w:10, h:20, vx:0.3, vy:0, alive:true, active:false, squash:0, pessoa:true, nao:0, disse:false, cor:['#31a7ff','#c94a3a','#7a5cc0'][k % 3], ground:false});
    } else if (k % 2 === 1 && k !== w.desabei && w.inimigos){
      const nm = w.inimigos[((k - 1) / 2) % w.inimigos.length];
      enemies.push({x:(x0+7)*T, y:GROUND*T - 14, w:14, h:14, vx:-0.45 - (i > 5 ? 0.15 : 0), vy:0, alive:true, active:false, squash:0, label:nm, ground:false});
    }
    for (let c = 0; c < 3; c++) coins.push({x:(x0+5+c)*T + 4, y:(GROUND-2)*T + 2, taken:false});
    if (k === w.desabei) continue;
    if (w.instavel && k < w.instavel){
      for (let x = x0+8; x <= x0+10; x++){ map[GROUND][x] = 8; map[GROUND+1][x] = 0; }
      continue;
    }
    const type = (k + i) % 4;
    if (type === 0){
      for (let x = x0+8; x < x0+10; x++){ map[GROUND][x] = 0; map[GROUND+1][x] = 0; }
    } else if (type === 1){
      const h = 2 + (rnd() > 0.6 ? 1 : 0);
      for (let y = GROUND-h; y < GROUND; y++) map[y][x0+9] = 4;
    } else if (type === 2){
      for (let x = x0+7; x <= x0+10; x++){ map[QROW+1][x] = 2; coins.push({x:x*T + 4, y:(QROW-1)*T + 4, taken:false}); }
    } else {
      [1,2,1].forEach((h, j) => { for (let y = GROUND-h; y < GROUND; y++) map[y][x0+8+j] = 5; });
    }
  }
  const lv = {map, cols, q, enemies, coins, flagX:(cols - 9) * T, crumbleT:{}, npc:null, desabei:false, desX, start, SEG};
  if (w.tenente) lv.npc = {x:-30, y:GROUND*T - 22, w:12, h:22, vx:0, vy:0, met:false, on:false, ground:false};
  return lv;
}
function tile(tx, ty){ if (ty < 0 || ty >= ROWS || tx < 0 || tx >= L.cols) return 0; return L.map[ty][tx]; }
function solid(tx, ty){ if (tx < 0) return true; return tile(tx, ty) > 0; }
function moveX(o){
  o.x += o.vx;
  const top = Math.floor(o.y / T), bot = Math.floor((o.y + o.h - 0.01) / T);
  if (o.vx > 0){ const tx = Math.floor((o.x + o.w) / T); for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)){ o.x = tx*T - o.w - 0.01; o.vx = 0; break; } }
  else if (o.vx < 0){ const tx = Math.floor(o.x / T); for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)){ o.x = (tx+1)*T; o.vx = 0; break; } }
}
function moveY(o){
  o.y += o.vy; o.ground = false; let bump = null;
  const l = Math.floor(o.x / T), r = Math.floor((o.x + o.w - 0.01) / T);
  if (o.vy > 0){ const ty = Math.floor((o.y + o.h) / T); for (let tx = l; tx <= r; tx++) if (solid(tx, ty)){ o.y = ty*T - o.h; o.vy = 0; o.ground = true; break; } }
  else if (o.vy < 0){ const ty = Math.floor(o.y / T), cx = Math.floor((o.x + o.w/2) / T); for (const tx of [cx, l, r]) if (solid(tx, ty)){ o.y = (ty+1)*T; o.vy = 0; bump = {tx, ty}; break; } }
  return bump;
}
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// destaques: [[m:]] marca-texto, [[r:]] vermelho, [[b:]] cor do capítulo, [[i:]] itálico, [[s:]] riscado
function fmt(s){
  return esc(s).replace(/\[\[(m|r|b|i|s):([\s\S]*?)\]\]/g, (_, k, t) =>
    k === 'm' ? `<mark>${t}</mark>` : k === 'r' ? `<strong class="red">${t}</strong>` : k === 'b' ? `<strong class="hl">${t}</strong>` : k === 'i' ? `<em>${t}</em>` : `<s>${t}</s>`);
}
function paras(t){ return String(t || '').split('\n').map(x => x.trim()).filter(Boolean).map(x => `<p>${fmt(x)}</p>`).join(''); }
function lines(t){ return String(t || '').split('\n').map(x => fmt(x.trim())).join('<br>'); }
function pageBody(c){
  let h = '';
  if (c.video) h += `<figure><video src="${esc(c.video)}" poster="${esc(c.poster || '')}" muted loop playsinline controls preload="metadata"></video></figure>`;
  if (c.foto) h += `<figure><img src="${esc(c.foto)}" alt="${esc(c.leg || c.titulo || c.grande || 'foto do Tiago')}" loading="lazy">${(c.ano || c.leg) ? `<figcaption>${c.ano ? `<b>${esc(c.ano)}</b> ` : ''}${esc(c.leg || '')}</figcaption>` : ''}</figure>`;
  if (c.icones) h += `<div class="icones" aria-hidden="true">${esc(c.icones)}</div>`;
  if (c.titulo) h += `<h3>${fmt(c.titulo)}</h3>`;
  if (c.grande) h += `<h2>${fmt(c.grande)}</h2>`;
  if (c.dica) h += `<div class="dica"><b>Dica:</b>${paras(c.texto)}</div>`; else if (c.texto) h += paras(c.texto);
  if (c.citacao) h += `<blockquote>${lines(c.citacao)}</blockquote>`;
  if (c.velho) h += `<div class="velho">${lines(c.velho)}</div>`;
  if (c.verbete) h += `<div class="verbete"><b>${esc(c.verbete[0])}</b>${paras(c.verbete[1])}</div>`;
  if (c.livro) h += `<div class="livro"><blockquote>${lines(c.livro[0])}</blockquote><span>${fmt(c.livro[1])}</span></div>`;
  if (c.term) h += `<div class="term">${esc(c.term)}<i class="cursor"></i></div>`;
  if (c.data) h += `<div class="cal"><span>janeiro</span><b>6</b></div>`;
  if (c.antes) h += paras(c.antes);

    if (fly.y < 26){ fly.y = 26; fly.vy = 0; } if (fly.y > 200){ fly.y = 200; fly.vy = 0; }
    if (fly.hit > 0) fly.hit--;

  const lose = Math.min(gears, 3); gears -= lose;
  for (let k = 0; k < lose; k++) parts.push({x:P.x + 5, y:P.y, vx:(Math.random() - .5) * 3, vy:-2 - Math.random() * 2, t:40});
}
function update(){
  frame++;

    // "Desabei.": o chão some embaixo dos pés
    const c = Math.floor((P.x + P.w/2) / T);
    L.hole = [c - 2, c + 2];
    for (let tx = c - 2; tx <= c + 2; tx++){ if (tile(tx, GROUND)) falling.push({x:tx*T, y:GROUND*T, vy:-1 - Math.random()}); L.map[GROUND][tx] = 0; L.map[GROUND+1][tx] = 0; }
    P.vx = 0; L.desabei = 'falling';
  }
  if (L.desabei === 'falling'){
    P.vx *= 0.8; P.vy = Math.min(P.vy + 0.5, 7); P.y += P.vy;
    for (const f of falling){ f.vy = Math.min(f.vy + 0.4, 8); f.y += f.vy; }
    if (P.y > H + 30) startQuarto();

  }
  const ax = P.ground ? 0.3 : 0.18, max = keys.run ? 3.4 : 2.4;
  if (P.freeze > 0) P.freeze--;

  else if (keys.left){ P.vx -= ax; P.face = -1; }

  P.vx = clamp(P.vx, -max, max);
  P.coyote = P.ground ? 6 : P.coyote - 1;
  if (jumpBuf > 0){ jumpBuf--; if (P.coyote > 0){ P.vy = keys.run ? -8 : -7.6; P.coyote = 0; jumpBuf = 0; } }
  P.vy = Math.min(P.vy + ((keys.jump && P.vy < 0) ? 0.36 : 0.75), 9);
  moveX(P);
  let b = moveY(P);
  // se a pessoa passar direto pelo bloco do "Desabei.", ele abre sozinho
  if (!b && L.desX >= 0 && !L.desabei && P.x > (L.desX + 1) * T && L.map[QROW][L.desX] === 3) b = {tx:L.desX, ty:QROW};
  if (b){
    const v = L.map[b.ty][b.tx];
    if (v === 2 || v === 3) bumps.push({tx:b.tx, ty:b.ty, t:10});
    if (v === 3){
      L.map[b.ty][b.tx] = 6;
      const k = L.q[b.tx + ',' + b.ty];
      if (k !== undefined){
        seen.add(k); setMission();
        for (let s = 0; s < 10; s++) parts.push({x:b.tx*T + 8, y:b.ty*T, vx:(Math.random() - .5) * 3, vy:-1.5 - Math.random() * 2.5, t:34, star:true});
        const w = WORLDS[wi];
        if (k === w.desabei) L.desabei = 'pending';
        if (L.npc && k === 0 && !L.npc.on){ L.npc.on = true; L.npc.x = Math.max(-20, P.x - 110); L.npc.y = GROUND*T - 22; }
        queueCard(cardHTML(w, w.cards[k], `<span>memória ${seen.size}/${w.cards.length}</span>`));
      }
    }
  }
  // base instável
  if (P.ground){
    const fy = Math.floor((P.y + P.h + 1) / T), l = Math.floor(P.x / T), r = Math.floor((P.x + P.w - 0.01) / T);
    let onCrumble = false;
    for (const tx of [l, r]) if (tile(tx, fy) === 8){
      onCrumble = true; const key = tx + ',' + fy; L.crumbleT[key] = (L.crumbleT[key] || 0) + 1;
      if (L.crumbleT[key] > 26){ L.map[fy][tx] = 0; falling.push({x:tx*T, y:fy*T, vy:0}); }
    }
    if (!onCrumble) lastSafe = {x:P.x, y:P.y};
  }
  if (P.inv > 0) P.inv--;
  if (P.y > H + 20){
    // caiu num buraco: renasce um pouco antes, parado meio segundo; na segunda queda no mesmo lugar, renasce do outro lado
    gears = Math.max(0, gears - 2);
    const gap = Math.floor((P.x + P.w / 2) / T);
    L.quedas = (L.quedaEm === gap || Math.abs((L.quedaEm || -99) - gap) <= 2) ? (L.quedas || 0) + 1 : 1; L.quedaEm = gap;
    let x = lastSafe.x - 24, y = lastSafe.y - 4;
    if (L.quedas >= 2){
      let tx = gap; while (tx < L.cols - 2 && !(tile(tx, GROUND) && tile(tx + 1, GROUND) && tile(tx, GROUND) !== 8 && !solid(tx, GROUND - 1))) tx++;
      x = tx * T + 3; y = GROUND * T - P.h - 2; L.quedas = 0;

    while (x > 0 && !solid(Math.floor((x + P.w / 2) / T), Math.floor((y + P.h + 2) / T)) && !solid(Math.floor((x + P.w / 2) / T), GROUND)) x -= T;
    P.x = Math.max(0, x); P.y = y; P.vx = 0; P.vy = 0; P.inv = 60; P.freeze = 30;
    for (const k in keys) keys[k] = false;
  }
  // tenente
  const npc = L.npc;
  if (npc && npc.on && !npc.met){
    const target = P.x - 26;
    // no começo dá pra fugir; da metade da fase em diante ele alcança
    npc.vx = clamp((target - npc.x) * 0.05, -1.4, P.x > L.flagX * 0.45 ? 4 : 1.75);

    if (hit(P, npc)){
      npc.met = true; P.vx = 2.5; P.vy = -4;
      queueCard(cardHTML(WORLDS[wi], WORLDS[wi].tenenteCard));
    }
  }
  for (const e of L.enemies){
    if (!e.alive){ if (e.squash > 0) e.squash--; continue; }
    if (!e.active){ if (e.x < cam + W + 24) e.active = true; else continue; }
    e.vy = Math.min(e.vy + 0.5, 8);
    const pvx = e.vx; moveX(e); if (e.vx === 0) e.vx = -pvx;
    moveY(e);
    if (e.ground){
      const fx = e.vx < 0 ? e.x - 1 : e.x + e.w + 1;
      const below = tile(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T));
      if (below === 0 || below === 8) e.vx = -e.vx;
    }
    if (e.y > H + 30){ e.alive = false; continue; }
    if (e.nao > 0) e.nao--;
    if (e.pessoa){
      // ninguém pisa em gente: a pessoa só diz NÃO e segue
      if (hit(P, e) && !e.disse){ e.disse = true; e.nao = 70; nos++; e.vx = P.x < e.x ? 0.8 : -0.8; P.vx *= 0.3; }
      continue;
    }
    if (hit(P, e)){
      const stomp = P.vy > 0 && (P.y + P.h - P.vy) <= e.y + 5;
      if (stomp){ e.alive = false; e.squash = 36; P.vy = keys.jump ? -7 : -5; P.y = e.y - P.h; gears++; }
      else hurt(e);
    }
  }
  for (const c of L.coins){ if (!c.taken && hit(P, {x:c.x, y:c.y, w:8, h:10})){ c.taken = true; gears++; doces++; } }
  for (const f of falling){ f.vy = Math.min(f.vy + 0.4, 8); f.y += f.vy; }
  falling = falling.filter(f => f.y < H + 20);
  for (const p of parts){ p.vy += 0.18; p.x += p.vx; p.y += p.vy; p.t--; }
  parts = parts.filter(p => p.t > 0);
  bumps = bumps.filter(k => --k.t > 0);
  cam = clamp(P.x + P.w/2 - W * 0.4, 0, L.cols * T - W);
  if (P.x + P.w >= L.flagX + 6){ worldDone(); }
}

  if (fly.hit > 0 && frame % 6 < 3) return drawFlightHUD();
  ctx.fillStyle = '#f4f6fb'; ctx.fillRect(px, py, 86, 16); ctx.fillRect(px + 86, py + 3, 8, 10); ctx.fillRect(px + 94, py + 6, 4, 5);
  ctx.fillStyle = v.cor; ctx.fillRect(px, py + 10, 94, 3);
  ctx.fillStyle = '#d0d6e6'; ctx.beginPath(); ctx.moveTo(px + 34, py + 12); ctx.lineTo(px + 54, py + 12); ctx.lineTo(px + 36, py + 34); ctx.lineTo(px + 26, py + 34); ctx.fill();
  ctx.fillStyle = '#f4f6fb'; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 10, py); ctx.lineTo(px - 2, py - 18); ctx.lineTo(px - 10, py - 18); ctx.fill();
  ctx.fillStyle = v.cor; ctx.fillRect(px - 9, py - 18, 7, 4);
  ctx.fillStyle = '#7fb6e6'; for (let i = 0; i < 7; i++) ctx.fillRect(px + 14 + i * 9, py + 3, 5, 5);
  ctx.fillStyle = '#2a1a12'; ctx.fillRect(px + 60, py + 3, 5, 2); ctx.fillStyle = '#d9a37a'; ctx.fillRect(px + 60, py + 5, 5, 3);
  drawFlightHUD();
}
function drawFlightHUD(){
  const v = fly.v;
  ctx.fillStyle = 'rgba(8,10,22,.78)'; ctx.fillRect(0, 0, W, 15);
  ctx.fillStyle = v.cor; ctx.fillRect(0, 15, W * Math.min(1, fly.t / FLY_LEN), 2);
  ctx.font = '800 7.5px "Libre Franklin", sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = v.cor; ctx.fillText(`${v.de.toUpperCase()}  ✈  ${v.para.toUpperCase()}`, 6, 8);
  ctx.textAlign = 'right'; ctx.fillStyle = '#eef1ff'; drawGear(W - 38, 3, false); ctx.fillText(String(gears), W - 6, 8);
}
/* ============ QUARTO: depois do "Desabei." ============ */
function startQuarto(){ mode = 'quarto'; paused = false; quarto = {t:0}; }
let quarto = null;
function updateQuarto(){
  frame++; quarto.t++;
  if (quarto.t === 170){
    paused = true;
    const w = WORLDS[wi], k = w.quarto;
    seen.add(k); setMission();
    queueCard(cardHTML(w, w.cards[k], `<span>memória ${seen.size}/${w.cards.length}</span>`), {ok: endQuarto});
  }
}
function endQuarto(){
  // a base se firma: do buraco pra frente, o chão vira rocha
  const from = L.hole[0];
  for (let tx = from; tx < L.cols; tx++) for (const ty of [GROUND, GROUND+1]){ if (tile(tx, ty) === 1 || tile(tx, ty) === 8) L.map[ty][tx] = 9; }
  for (let tx = L.hole[0]; tx <= L.hole[1]; tx++){ L.map[GROUND][tx] = 9; L.map[GROUND+1][tx] = 9; }
  falling = []; L.desabei = 'ok';
  P.x = (L.hole[1] + 2) * T; P.y = GROUND*T - P.h - 30; P.vx = 0; P.vy = 0; P.inv = 40;
  lastSafe = {x:P.x, y:GROUND*T - P.h};
  mode = 'play'; paused = false;
}
function drawQuarto(){
  const t = quarto.t;
  ctx.fillStyle = '#05040c'; ctx.fillRect(0, 0, W, H);
  if (t < 30){ // ainda caindo
    for (let i = 0; i < 20; i++){ ctx.fillStyle = 'rgba(165,108,255,.25)'; ctx.fillRect((i * 53) % W, ((i * 37) + t * 9) % H, 1, 8); }
    drawSprite(154, Math.round(-20 + t * 6), 1, true);
    return;
  }
  const a = Math.min(1, (t - 30) / 60);
  // quarto: parede, porta fechada, cama
  ctx.fillStyle = `rgba(42,31,74,${a})`; ctx.fillRect(0, 0, W, 196);
  ctx.fillStyle = `rgba(28,20,52,${a})`; ctx.fillRect(0, 196, W, 44);
  ctx.fillStyle = `rgba(20,14,38,${a})`; ctx.fillRect(34, 98, 46, 98); ctx.fillStyle = `rgba(255,211,107,${a * .6})`; ctx.fillRect(72, 148, 3, 3);
  ctx.fillStyle = `rgba(70,55,110,${a})`; ctx.fillRect(226, 164, 74, 32); ctx.fillStyle = `rgba(220,215,240,${a * .8})`; ctx.fillRect(228, 158, 22, 8);
  // luz que desce
  const g = Math.max(0, (t - 70) / 80);
  if (g > 0){
    const r = 30 + g * 110;
    const grd = ctx.createRadialGradient(160, 150, 4, 160, 150, r);
    grd.addColorStop(0, `rgba(255,236,170,${0.55 * Math.min(1, g)})`); grd.addColorStop(1, 'rgba(165,108,255,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255,236,170,${0.25 * Math.min(1, g)})`; ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(170, 0); ctx.lineTo(200, 196); ctx.lineTo(120, 196); ctx.fill();
  }
  // Tiaguinho de joelhos
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, 196); ctx.clip();
  drawSprite(154, 182, 1, false); ctx.restore();
  ctx.fillStyle = WORLDS[wi].look.p; ctx.fillRect(152, 192, 16, 4);
}
function draw(){
  ctx.setTransform(scale, 0, 0, scale, 0, 0); ctx.imageSmoothingEnabled = false;
  if (mode === 'map' || mode === 'title') drawMap();
  else if (mode === 'flight') drawFlight();
  else if (mode === 'quarto') drawQuarto();
  else if (L) drawPlay();
}

/* ============ SOM: trilhas do link na bio ============ */
// os mesmos trechos que tocam em cada capítulo do link na bio: [arquivo, início, fim] em segundos
const TRECHOS = {origem:[1, 0.0, 170.5], fe:[1, 172.5, 352.1], intervalo:[1, 354.1, 600.11], legiao:[1, 602.11, 842.11], diferente:[2, 0.0, 169.74], rainbows:[2, 171.74, 365.56], professor:[2, 367.56, 524.21], vendas:[2, 526.21, 809.61], mudanca:[3, 0.0, 185.9], empreender:[3, 187.9, 443.48], disciplina:[3, 445.48, 733.48]};
let somOn = false, audio = null, trechoAtual = null;
const somBtn = document.getElementById('somBtn');
function trechoAgora(){
  if (mode === 'map' || mode === 'title') return WORLDS[unlocked].trecho;
  if (mode === 'flight') return WORLDS[fly.to - 1].trecho;
  return WORLDS[wi].trecho;
}
function playMusic(){
  if (!somOn) return;
  const nome = trechoAgora(), tr = TRECHOS[nome];
  if (!tr) return;
  if (!audio){
    audio = new Audio(); audio.volume = 0.5; audio.preload = 'auto';
    audio.addEventListener('timeupdate', () => { const t = TRECHOS[trechoAtual]; if (t && audio.currentTime >= t[2] - 0.15) audio.currentTime = t[1]; });
  }
  if (trechoAtual === nome){ if (audio.paused) audio.play().catch(() => {}); return; }
  trechoAtual = nome;
  const src = `../midia/musica/trilha-${tr[0]}.mp3`;
  const ir = () => { try { audio.currentTime = tr[1]; } catch (e) {} audio.play().catch(() => {}); };
  if (!audio.src.endsWith(src)){ audio.src = src; audio.addEventListener('loadedmetadata', ir, {once:true}); audio.play().catch(() => {}); }
  else ir();
}
somBtn.onclick = () => {
  somOn = !somOn; somBtn.setAttribute('aria-pressed', String(somOn)); somBtn.textContent = somOn ? '♪ som ligado' : '♪ som';
  if (somOn) playMusic(); else if (audio) audio.pause();
};
document.getElementById('mapBtn').onclick = () => goMap(mode === 'play' ? wi : unlocked);

/* ============ ENTRADA ============ */
const KM = {ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyZ:'jump', ShiftLeft:'run', ShiftRight:'run', KeyX:'run'};
addEventListener('keydown', e => {
  if (!ov.hidden){ if (e.code === 'Enter' || e.code === 'Space'){ const b = ov.querySelector('button:focus') || ov.querySelector('button'); if (b && document.activeElement !== b){ e.preventDefault(); b.click(); } } return; }
  if (e.code === 'KeyM'){ goMap(mode === 'play' ? wi : unlocked); return; }
  const k = KM[e.code]; if (!k) return; e.preventDefault();
  if (k === 'jump' && !keys.jump) jumpBuf = 6;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys[k] = false; });
const soltarTudo = () => { for (const k in keys) keys[k] = false; };
addEventListener('pointerup', e => { if (!e.target.closest || !e.target.closest('#pad')) soltarTudo(); });
addEventListener('blur', soltarTudo);
document.addEventListener('visibilitychange', () => {
  soltarTudo();
  if (!audio) return;
  if (document.hidden) audio.pause(); else if (somOn) audio.play().catch(() => {});
});
document.querySelector('.full a').addEventListener('click', () => { if (audio) audio.pause(); });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); if (k === 'jump' && !keys.jump) jumpBuf = 6; keys[k] = true; b.setPointerCapture?.(e.pointerId); };
  const off = e => { e.preventDefault(); keys[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ============ LAÇO ============ */
let acc = 0, last = performance.now();
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60){
    acc -= 1000 / 60;
    if (ov.hidden){
      if (mode === 'play' && !paused) update();
      else if (mode === 'map') updateMap();
      else if (mode === 'flight') updateFlight();
      else if (mode === 'quarto') updateQuarto();
      else frame++;
    }
  }
  document.body.classList.toggle('jogando', mode === 'play' || mode === 'flight' || mode === 'quarto');
  draw(); requestAnimationFrame(loop);
}
// cartão aberto esconde os botões de andar
new MutationObserver(() => document.body.classList.toggle('carta', !ov.hidden)).observe(ov, {attributes:true, attributeFilter:['hidden']});
// "jogar em pé": some o aviso até recarregar a página
const aviso = document.getElementById('aviso');
const deitou = () => { document.body.classList.add('deitou'); };
aviso.addEventListener('click', deitou);
aviso.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') deitou(); });
addEventListener('resize', resize);
resize();
sel = cityOf(unlocked);
missionEl.innerHTML = '<b>11 capítulos</b> · uma história em construção';
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  resize();
  titleScreen();
});
requestAnimationFrame(loop);
})();
</script>
